<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The pipeline with a large language model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/pipeline.css">
<style>:root{ --accent:var(--era5) }</style>
</head>
<!-- ===========================================================================
  WEEK 4 — the same pipeline, with a prompted model, and one step fewer.
  Redraw of text_analysis_fundamentals/Slide05 and Slide06.

  The only variant that TAKES A BOX AWAY: step 02 is drawn dashed and the texts
  run straight past it into step 03, because a prompted model reads the text
  itself. Two arrows arrive at the bottom of step 03 — the text on the left,
  the prompt on the right — which is exactly what an API call contains.

  This variant deliberately draws its bypass just above G.SLOT (y = 224). That
  band is otherwise engine space; nothing else uses it, and it stops short of
  x = 880 so it cannot reach the hand coded subset under step 04.
=========================================================================== -->
<body>
<svg id="chart" viewBox="-8 -10 996 440" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="The text classification pipeline with a large language model: step 02 falls away, the texts go straight to step 03, and a pre-trained model plus a prompt do the classifying. Click to step through."></svg>
<noscript><p style="max-width:34em;margin:2em;font-family:sans-serif">Needs JavaScript: the text
classification pipeline, with a prompted language model.</p></noscript>

<script src="../shared/pipeline.js"></script>
<script>
(function () {
  "use strict";
  var P = CADCPipeline.build({
    matrix: { kind: "counts", label: "texts × words" }
  });
  var G = P.G, S = P.layer.slot;

  /* -- the texts run straight past step 02 ---------------------------------- */
  var bypass = P.g(S, {});
  P.elbow(bypass, [[G.ART[0], G.MID + 34], [G.ART[0], 224], [635, 224], [635, G.BY + G.BH + 2]], "feed flow");
  P.txt(bypass, "the model reads the text itself", { x: 350, y: 218, "class": "lbl left" });
  P.show(bypass, false, true);

  /* -- the model, pre-trained by somebody else ------------------------------ */
  var model = P.g(S, {});
  (function () {
    P.corpus(model, 40, 246, 7, 4, 13, 13);
    P.wrap(model, "an enormous corpus you will never see", { x: 85, y: 316, width: 130, lh: 12, "class": "lbl", anchor: "middle" });
    P.arrow(model, 140, 272, 562, 272);
    P.txt(model, "pre-training", { x: 350, y: 264, "class": "lbl", "font-style": "italic" });
    P.oval(model, G.CX[2], 290, 115, 52, "A large language model",
           "GPT · Llama · Claude · a fine tuned BERT", "spark");
    P.show(model, false, true);
  })();

  /* -- your instrument: the prompt ------------------------------------------ */
  var prompt = P.g(S, {});
  (function () {
    var x = 380, y = 352, w = 410;
    P.card(prompt, { x: x, y: y, w: w, h: 58, cls: "tint", pad: 12, icon: "prompt", title: "Your prompt" });
    P.txt(prompt, "Read the review below. Answer with one word:", { x: x + 12, y: y + 36, "class": "mono" });
    P.txt(prompt, "positive, negative or neutral.  Review: {text}", { x: x + 12, y: y + 49, "class": "mono" });
    P.elbow(prompt, [[440, y - 4], [440, 308], [562, 308]], "feed flow");
    P.arrow(prompt, G.CX[2], 236, G.CX[2], G.BY + G.BH + 2, "feed flow");
    P.txt(prompt, "no task specific training", { x: G.CX[2] + 14, y: 226, "class": "lbl left" });
    P.show(prompt, false, true);
  })();

  /* -- scenes: what each click puts on screen ---------------------------
     (the lecturer narrates these; nothing is printed under the figure) 
       0. Everything so far, in one row.
       1. Step 02 falls away.
       2. The model arrives already trained.
       3. So your instrument is the prompt.
       4. 01 and 04 are exactly what they were in week 1.
     -------------------------------------------------------------------- */
  var SCENES = 5;
  CADCPipeline.run(P, SCENES, function (s) {
    P.setSteps([ "", s >= 1 ? "off" : "", s >= 3 && s < 4 ? "on accent" : "", s === 4 ? "on accent" : "" ]);
    [P.art.docs, P.art.lab, P.art.gold, P.fb].forEach(function (n) { P.show(n, true); });
    P.show(P.art.mat, s < 1);
    P.show(bypass, s >= 1, true); P.show(model, s >= 2, true); P.show(prompt, s >= 3, true);
    if (s === 3) P.travel(G.ART[0], G.MID, G.ART[2], G.MID);
  });
})();
</script>
</body>
</html>
