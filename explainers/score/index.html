<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three tweets, one word list</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  /* ==========================================================================
     Three tweets, one word list — the week 2 cold open.

     Three real tweets from data/corona-tweets.csv (#corona, November 2021),
     scored with the Bing sentiment lexicon (Hu & Liu, 2004) exactly as the
     deck's R code scores them: a listed word counts +1 or -1, the sign of the
     sum is the verdict. The matches below were produced by that code, not
     typed from memory (tweet 1: good, work · tweet 2: criminal, conspiracy ·
     tweet 3: work, works, work). The "you" column is a human reading — the
     one the room gives before the first click.

     Text is laid out word by word with measured widths (getComputedTextLength,
     re-run when the web font arrives), so the highlight sits under the word
     whatever font is on the machine.

     Click / Enter / space advances; #N in the URL opens at step N.
     No caption band: the narration is in the slide's speaker notes.
     ========================================================================== */
  :root{
    --ink:#1a1a17; --ink-2:#3a3a34; --ink-3:#5a5a52; --muted:#7a7a70; --faint:#9a9a90;
    --hair:#e7e3d9; --border:#e0dcd0; --surface:#ffffff; --strip:#f2f0ea;
    --accent:#2f7f9e; --accent-tint:#e6f2f7;
    --pos:#2678b0; --pos-tint:#e8f1f8;
    --neg:#b84a27; --neg-tint:#fbeee8;
    --font:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* The deck shows this one on a dark slide. `?dark` in the iframe URL (a
     query string, so the #N step bookmark still works after it) switches to
     the dark tokens the Playground tools use; nothing else changes. */
  :root.dark{
    --ink:#e8eaec; --ink-2:#cfd6de; --ink-3:#a8c0d4; --muted:#7d9bb5; --faint:#6d8ba6;
    --hair:#2c4560; --border:#2c4560; --surface:#16304a; --strip:#1b3550;
    --accent:#5cb0cf; --accent-tint:#14313f;
    --pos:#3291d1; --pos-tint:#14304a;
    --neg:#d26a49; --neg-tint:#3a2118;
  }
  :root.dark .step{fill:var(--faint)}
  :root.dark .chip.human rect{fill:var(--surface)}
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{font-family:var(--font); background:transparent; color:var(--ink);
       display:flex; align-items:center; justify-content:center;
       overflow:hidden; cursor:pointer; -webkit-tap-highlight-color:transparent}
  svg{width:100%; height:100%; display:block}
  text{font-family:var(--font); fill:var(--ink)}
  .card{fill:var(--surface); stroke:var(--border); stroke-width:1.3}
  .card.miss{stroke:var(--neg); stroke-width:2.4}
  .n{font-size:10.5px; font-weight:700; letter-spacing:.09em; fill:var(--muted)}
  .w{font-size:15.5px; fill:var(--ink-2)}
  .w.pos{fill:var(--pos); font-weight:700} .w.neg{fill:var(--neg); font-weight:700}
  .hl{rx:3; ry:3; fill:var(--pos-tint)} .hl.neg{fill:var(--neg-tint)}
  .colh{font-size:10.5px; font-weight:700; letter-spacing:.09em; fill:var(--muted); text-anchor:middle}
  .tally{font-size:22px; font-weight:700; text-anchor:middle}
  .tally.pos{fill:var(--pos)} .tally.neg{fill:var(--neg)} .tally.zero{fill:var(--faint)}
  .chip rect{rx:6; ry:6} .chip text{font-size:11.5px; font-weight:700; letter-spacing:.06em; fill:#fff; text-anchor:middle}
  .chip.pos rect{fill:var(--pos)} .chip.neg rect{fill:var(--neg)}
  .chip.human rect{fill:var(--surface); stroke-width:1.6}
  .chip.human.pos rect{stroke:var(--pos)} .chip.human.pos text{fill:var(--pos)}
  .chip.human.neg rect{stroke:var(--neg)} .chip.human.neg text{fill:var(--neg)}
  .rule{stroke:var(--hair); stroke-width:1}
  .note{font-size:13px; fill:var(--ink-3)}
  .note tspan.b{font-weight:700; fill:var(--neg)}
  .step{font-size:10.5px; fill:#b6b2a8; text-anchor:end}
  .fade{transition:opacity .45s ease}
  .hid{opacity:0}
</style>
</head>
<body>
<svg id="chart" viewBox="0 0 1000 430" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Three tweets about corona. A sentiment word list highlights the words it knows, sums them to a score and gives a verdict; a human verdict appears beside it, and on the third tweet the two disagree.">
  <g id="cards"></g>
  <g id="hl" class="fade hid"></g>
  <g id="words"></g>
  <g id="cols"></g>
  <g id="hud"></g>
</svg>
<noscript><p style="max-width:34em;margin:2em;font-family:sans-serif">Needs JavaScript: three tweets
scored by a sentiment word list, compared with a human reading.</p></noscript>

<script>
(function () {
  "use strict";
  if (/[?&]dark(&|$)/.test(location.search)) document.documentElement.classList.add("dark");
  var NS = "http://www.w3.org/2000/svg";
  function el(t, a) { var e = document.createElementNS(NS, t); for (var k in a) if (a[k] != null) e.setAttribute(k, a[k]); return e; }
  function txt(p, s, a) { var t = el("text", a || {}); t.textContent = s; p.appendChild(t); return t; }
  function g(p, a) { var e = el("g", a || {}); p.appendChild(e); return e; }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  var gCards = document.getElementById("cards"), gHl = document.getElementById("hl"),
      gWords = document.getElementById("words"), gCols = document.getElementById("cols"),
      gHud = document.getElementById("hud");

  /* the Bing list's matches, as the deck's R code found them */
  var POS = { good: 1, work: 1, works: 1 }, NEG = { criminal: 1, conspiracy: 1 };
  var TWEETS = [
    { t: "With visual assistance, this is a good source of information in how mRNA vaccines work #COVID19 #Corona", human: "pos" },
    { t: "Mind-boggling. #Corona is a criminal conspiracy, just follow the patents.", human: "neg" },
    { t: "If the masks work, why the 6 feet? If the 6 feet works, why the masks? If they both work, why lockdown? #COVID19 #Corona", human: "neg" }
  ];

  var X0 = 20, CW = 610, PAD = 16, LINE = 22, CY0 = 28, CH = 112, GAP = 14;
  var COLX = { plus: 705, minus: 770, list: 860, human: 950 };

  function polarity(w) {
    var k = w.toLowerCase().replace(/[^a-z']/g, "");
    if (POS[k]) return "pos"; if (NEG[k]) return "neg"; return "";
  }

  var cards = TWEETS.map(function (tw, i) {
    var y = CY0 + i * (CH + GAP);
    var rect = el("rect", { "class": "card", x: X0, y: y, width: CW, height: CH, rx: 10 });
    gCards.appendChild(rect);
    txt(gCards, "TWEET " + (i + 1), { x: X0 + PAD, y: y + 22, "class": "n" });
    var words = tw.t.split(/\s+/).map(function (w) {
      var t = txt(gWords, w, { "class": "w " + polarity(w) });
      return { w: w, node: t, pol: polarity(w) };
    });
    var pos = 0, neg = 0;
    words.forEach(function (w) { if (w.pol === "pos") pos++; if (w.pol === "neg") neg++; });
    var score = pos - neg;
    return { y: y, rect: rect, words: words, pos: pos, neg: neg, score: score,
             list: score > 0 ? "pos" : "neg", human: tw.human, hls: [] };
  });

  /* words are laid out with measured widths; highlights are drawn from the
     same measurement so they sit exactly under the word */
  function layout() {
    clear(gHl);
    cards.forEach(function (c) {
      var x = X0 + PAD, y = c.y + 50, space = 5.2;
      c.words.forEach(function (w) {
        var wdt = w.node.getComputedTextLength();
        if (x + wdt > X0 + CW - PAD) { x = X0 + PAD; y += LINE; }
        w.node.setAttribute("x", x); w.node.setAttribute("y", y);
        if (w.pol) gHl.appendChild(el("rect", { "class": "hl " + w.pol, x: x - 3, y: y - 15, width: wdt + 6, height: 21 }));
        x += wdt + space;
      });
    });
  }

  /* the right-hand columns: + and − tallies, the list's verdict, the human's */
  var colHeads = g(gCols, { "class": "fade hid" });
  txt(colHeads, "+", { x: COLX.plus, y: 18, "class": "colh" });
  txt(colHeads, "−", { x: COLX.minus, y: 18, "class": "colh" });
  var headList = txt(gCols, "THE LIST SAYS", { x: COLX.list, y: 18, "class": "colh fade hid" });
  var headHuman = txt(gCols, "YOU SAID", { x: COLX.human, y: 18, "class": "colh fade hid" });

  function chip(parent, x, y, label, cls) {
    var k = g(parent, { "class": "chip " + cls });
    k.appendChild(el("rect", { x: x - 38, y: y - 13, width: 76, height: 26 }));
    txt(k, label, { x: x, y: y + 4 });
    return k;
  }
  cards.forEach(function (c) {
    var ym = c.y + CH / 2 + 6;
    c.tPos = txt(gCols, "+" + c.pos, { x: COLX.plus, y: ym, "class": "tally " + (c.pos ? "pos" : "zero") + " fade hid" });
    c.tNeg = txt(gCols, "−" + c.neg, { x: COLX.minus, y: ym, "class": "tally " + (c.neg ? "neg" : "zero") + " fade hid" });
    c.cList = chip(gCols, COLX.list, ym - 4, c.list === "pos" ? "POSITIVE" : "NEGATIVE", c.list + " fade hid");
    c.cHuman = chip(gCols, COLX.human, ym - 4, c.human === "pos" ? "POSITIVE" : "NEGATIVE", "human " + c.human + " fade hid");
  });
  gCols.appendChild(el("line", { "class": "rule", x1: 670, x2: 670, y1: CY0, y2: CY0 + 3 * CH + 2 * GAP }));

  var note = txt(gHud, "", { x: X0, y: 418, "class": "note fade hid" });
  var counter = txt(gHud, "", { x: 980, y: 418, "class": "step" });

  var MAX = 5;
  var state = Math.max(0, Math.min(MAX, parseInt((location.hash || "").slice(1), 10) || 0));
  function render() {
    layout();
    gHl.setAttribute("class", "fade" + (state >= 1 ? "" : " hid"));
    cards.forEach(function (c) {
      c.words.forEach(function (w) { w.node.setAttribute("class", "w " + (state >= 1 ? w.pol : "")); });
      c.tPos.setAttribute("class", "tally " + (c.pos ? "pos" : "zero") + " fade" + (state >= 2 ? "" : " hid"));
      c.tNeg.setAttribute("class", "tally " + (c.neg ? "neg" : "zero") + " fade" + (state >= 2 ? "" : " hid"));
      c.cList.setAttribute("class", "chip " + c.list + " fade" + (state >= 3 ? "" : " hid"));
      c.cHuman.setAttribute("class", "chip human " + c.human + " fade" + (state >= 4 ? "" : " hid"));
      var miss = state >= 5 && c.list !== c.human;
      c.rect.setAttribute("class", "card" + (miss ? " miss" : ""));
    });
    colHeads.setAttribute("class", "fade" + (state >= 2 ? "" : " hid"));
    headList.setAttribute("class", "colh fade" + (state >= 3 ? "" : " hid"));
    headHuman.setAttribute("class", "colh fade" + (state >= 4 ? "" : " hid"));
    clear(note);
    if (state >= 5) {
      var a = el("tspan", { "class": "b" }); a.textContent = "Three words from the list, one hostile tweet. ";
      note.appendChild(a);
      var b = el("tspan"); b.textContent = "The count is right about the words and wrong about the text — and nothing in the number says so."; note.appendChild(b);
    }
    note.setAttribute("class", "note fade" + (state >= 5 ? "" : " hid"));
    counter.textContent = (state + 1) + " / " + (MAX + 1);
  }
  function advance() { if (state >= MAX) return; state += 1; render(); }
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  window.addEventListener("hashchange", function () {
    state = Math.max(0, Math.min(MAX, parseInt((location.hash || "").slice(1), 10) || 0)); render();
  });
  document.body.addEventListener("click", advance);
  document.body.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") advance(); });
})();
</script>
</body>
</html>
