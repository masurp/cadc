<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside a small language model — CADC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  /* --- tokens ---------------------------------------------------------------
     The tool is a dark stage in both colour schemes, like the lecture figure it
     grew out of (explainers/gpt3d). Blue and orange are the sign of a number,
     green is the course accent for week 4's "what the model made", amber marks
     the one thing a step is about. */
  :root{
    --bg:#10243a; --panel:#142c44; --surface:#16304a; --strip:#1b3550; --hair:#2c4560;
    --ink:#e8eaec; --ink-2:#cfd6de; --ink-3:#a8c0d4; --muted:#7d9bb5; --faint:#4e6a86;
    --accent:#4fc08d; --amber:#f0b250; --pos:#4aa8dc; --neg:#e07a52;
    --font:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{font-family:var(--font); background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; overflow:hidden}
  button,select,input{font:inherit; color:inherit}
  .app{display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto; height:100vh; min-height:480px}

  /* --- top: the prompt ------------------------------------------------------ */
  .top{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--hair); background:var(--panel)}
  .k{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .prompt{display:flex; flex-wrap:wrap; gap:4px; align-items:center}
  .btn{font-size:12px; padding:4px 9px; cursor:pointer; border:1px solid var(--hair); border-radius:6px; background:var(--surface); color:var(--ink-2)}
  .btn:hover:not(:disabled){border-color:var(--accent); color:var(--ink)}
  .btn:disabled{opacity:.4; cursor:default}
  .btn[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:#0c1c2c; font-weight:700}
  .btn.tokb{font-weight:700; color:var(--ink)}
  .btn.go{background:var(--accent); border-color:var(--accent); color:#0c1c2c; font-weight:700}
  .btn.go:hover:not(:disabled){color:#0c1c2c; filter:brightness(1.08)}
  .top select, .card select{font-size:12px; padding:4px 6px; border:1px solid var(--hair); border-radius:6px; background:var(--surface); color:var(--ink-2); max-width:210px}
  .spacer{flex:1 1 0}
  .pop{position:relative}
  .pop__list{position:absolute; z-index:5; top:calc(100% + 6px); left:0; width:300px; padding:8px; display:none; flex-wrap:wrap; gap:4px;
             background:var(--surface); border:1px solid var(--hair); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .pop.open .pop__list{display:flex}

  /* --- the stage and the panel ---------------------------------------------- */
  .main{display:grid; grid-template-columns:minmax(0,1fr) 410px; min-height:0}
  .stage{position:relative; min-height:0; overflow:hidden; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
  .stage.drag{cursor:grabbing}
  .stage.pt{cursor:pointer}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  .tip{position:absolute; z-index:3; pointer-events:none; max-width:250px; padding:6px 9px; font-size:11.5px; line-height:1.4;
       background:rgba(10,24,40,.94); border:1px solid var(--hair); border-radius:6px; color:var(--ink-2); display:none}
  .tip b{color:var(--ink)} .tip .n{font-family:var(--mono); color:var(--amber); font-weight:700}
  .view{position:absolute; right:10px; top:10px; display:flex; gap:4px; z-index:2}
  .view .btn{background:rgba(22,48,74,.85); min-width:30px}
  .legend{position:absolute; left:12px; bottom:9px; z-index:2; font-size:10.5px; color:var(--muted); pointer-events:none; display:flex; flex-wrap:wrap; gap:3px 12px; max-width:calc(100% - 24px)}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px}
  .legend .hint{transition:color .3s} .legend .hint.flash{color:var(--amber)}

  .panel{border-left:1px solid var(--hair); background:var(--panel); overflow-y:auto; padding:16px 18px 22px; min-height:0}
  .panel .kick{font-size:10.5px; font-weight:700; letter-spacing:.1em; color:var(--accent); text-transform:uppercase}
  .panel h2{font-size:19px; line-height:1.25; margin:3px 0 10px; font-weight:700}
  .panel p{margin:0 0 9px; color:var(--ink-2); font-size:13.5px}
  .panel p b{color:var(--ink)} .tk{color:var(--ink); font-weight:700; white-space:nowrap}
  .panel p .a{color:var(--accent); font-weight:700}
  .card{margin-top:14px; padding:11px 12px 12px; background:var(--surface); border:1px solid var(--hair); border-radius:8px}
  .card .k{display:block; margin-bottom:7px}
  .card .row{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-bottom:9px}
  .card .row .k{margin:0 4px 0 0}
  .card small{display:block; color:var(--muted); font-size:11.5px; margin-top:7px; line-height:1.45}
  .st{margin-top:6px}
  .st-l{font-size:11px; color:var(--ink-3); margin-bottom:2px} .st-l b{color:var(--ink)} .st-l .op{display:inline-block; width:14px; font-family:var(--mono); color:var(--amber); font-weight:700}
  .st-c{display:grid; grid-template-columns:repeat(12,1fr); gap:2px}
  .st-c i{font:normal 9.5px/1 var(--mono); text-align:center; padding:5px 0; border-radius:2px; color:#fff; overflow:hidden}
  .res{margin-top:8px; font-size:12.5px; color:var(--ink-2)} .res b{font-family:var(--mono); color:var(--amber)}
  table.t{width:100%; border-collapse:collapse; font-size:12px}
  table.t th{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:right; padding:2px 4px 4px; border-bottom:1px solid var(--hair)}
  table.t td{padding:3px 4px; text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--ink-2); border-bottom:1px solid rgba(44,69,96,.5)}
  table.t th:first-child, table.t td:first-child{text-align:left; font-family:var(--font); font-weight:700; color:var(--ink)}
  table.t tr.sum td{border-bottom:0; color:var(--ink); font-weight:700}
  table.t tr.dim td{color:var(--muted); font-weight:400}
  table.t tr.dim td:first-child{color:var(--muted); font-weight:400}
  .bar{display:inline-block; height:8px; border-radius:2px; background:var(--accent); vertical-align:middle; margin-right:6px; min-width:1px}
  .bar.g{background:var(--faint)} .bar.b{background:var(--pos)}
  .formula{font-family:var(--mono); font-size:12.5px; color:var(--ink); display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .frac{display:inline-flex; flex-direction:column; text-align:center} .frac span:first-child{border-bottom:1px solid var(--ink-3); padding:0 6px 2px} .frac span:last-child{padding:2px 6px 0}
  input[type=range]{width:100%; accent-color:var(--accent); margin:2px 0 8px; cursor:pointer}
  .ex{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin:0; padding:0; list-style:none}

  /* --- bottom: the steps ----------------------------------------------------- */
  .nav{display:flex; gap:10px; align-items:center; padding:8px 14px; border-top:1px solid var(--hair); background:var(--panel)}
  .rail{flex:1 1 0; display:flex; gap:5px; min-width:0; overflow-x:auto; scrollbar-width:none}
  .ch{flex:1 1 0; min-width:max-content; padding:4px 8px 5px; border-radius:6px; border:1px solid transparent; cursor:pointer; background:none; text-align:left}
  .ch:hover{border-color:var(--hair)}
  .ch.on{background:var(--surface); border-color:var(--hair)}
  .ch span{display:block; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
  .ch.on span{color:var(--accent)}
  .dots{display:flex; gap:4px; margin-top:4px}
  .dots i{width:14px; height:4px; border-radius:2px; background:var(--faint); cursor:pointer}
  .dots i:hover{background:var(--ink-3)} .dots i.on{background:var(--accent)} .dots i.done{background:var(--muted)}
  .count{font-size:11.5px; color:var(--muted); white-space:nowrap; min-width:48px; text-align:center}

  @media (max-width: 860px){
    .main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(230px,46%) minmax(0,1fr)}
    .panel{border-left:0; border-top:1px solid var(--hair)}
    .ch span{display:none} .ch{min-width:0; padding:6px 4px} .dots{margin:0}
    .legend .hint{display:none}
  }
</style>
</head>
<!-- ===========================================================================
  PLAYGROUND, WEEK 4 — a whole language model, small enough to see and really
  trained, drawn in three dimensions. Grown out of the lecture figure
  explainers/gpt3d (which stays as it is, with invented numbers, for the room);
  the drawing idea is Brendan Bycroft's "LLM Visualization" (bbycroft.net/llm,
  2023), much simplified.

  What is real:
    - the model. data.js holds the weights of a decoder of the GPT kind (12
      numbers per token, 3 blocks, a context of 8 tokens, 28 words), trained by
      _scripts/build_tinygpt.py on 4,000 sentences of an invented film-review
      grammar. The page runs its forward pass for the prompt on screen; every
      tile, score, percentage and bar is that computation. Nothing is drawn by
      hand, so what a step says about "this prompt" is computed too.
    - the comparison in the last step: GPT-3 (Brown et al. 2020, table 2.1: 96
      layers, 12,288 numbers per token, 96 heads, 2,048 tokens of context, 175
      billion weights; vocabulary 50,257) and Llama 3.1 8B (32 blocks, 4,096
      numbers, 32 heads, vocabulary 128,256, context 128,000, 8 billion).
  What the toy leaves out (said in the last step and on the tool's page): layer
  normalisation, several heads per block, sub-word tokens, the division of the
  attention scores by the root of the vector size. See the builder's header.

  Seventeen steps in seven chapters; #N opens step N. The camera flies to each
  step's view and is free at any time (drag, wheel, pinch, double-click). A
  click on a token column makes it the token the steps follow.
=========================================================================== -->
<body>
<div class="app">
  <div class="top">
    <span class="k">Prompt</span>
    <div class="prompt" id="prompt"></div>
    <div class="pop" id="pop"><button class="btn" id="addBtn" aria-haspopup="true">+ word</button><div class="pop__list" id="popList"></div></div>
    <button class="btn" id="delBtn" title="Remove the last word" aria-label="Remove the last word">⌫</button>
    <span class="spacer"></span>
    <select id="presets" aria-label="Example prompts"></select>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="c" role="img" aria-label="A small language model drawn in three dimensions, one tile per number. The prompt enters at the bottom as columns of twelve numbers, rises through three blocks of attention and a feed-forward network, and ends at the top in a bar for every word of the vocabulary. The panel beside the drawing explains each step in text."></canvas>
      <div class="view">
        <button class="btn" id="zOut" title="Zoom out" aria-label="Zoom out">−</button>
        <button class="btn" id="zIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="btn" id="zReset" title="Back to this step's view">Reset view</button>
      </div>
      <div class="legend"><span><i style="background:var(--pos)"></i>positive</span><span><i style="background:var(--neg)"></i>negative</span><span>brighter = further from zero</span>
        <span class="hint" id="hint">drag to turn · scroll to zoom · shift-drag to move · hover for numbers</span></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="panel" id="panel" aria-live="polite">
      <div class="kick" id="kick"></div>
      <h2 id="title"></h2>
      <div id="body"></div>
      <div id="card"></div>
    </div>
  </div>
  <div class="nav">
    <button class="btn" id="prev">‹ Back</button>
    <div class="rail" id="rail"></div>
    <span class="count" id="count"></span>
    <button class="btn go" id="next">Next ›</button>
  </div>
</div>
<noscript><p style="max-width:34em;margin:2em;font-family:sans-serif;color:#fff">This tool needs JavaScript: it runs a small language model in your browser and draws it.</p></noscript>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var M = window.TINYGPT;
  function $(id) { return document.getElementById(id); }
  var D = M.d, HID = M.hid, L = M.layers, CTX = M.ctx, VOC = M.vocab, V = VOC.length, BIG = 32;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var framed = window.top !== window.self;

  /* ---- the arithmetic: the model's forward pass, written out --------------------------- */
  function dot(a, b) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
  function matvec(W, x, b) { return W.map(function (r, i) { return dot(r, x) + (b ? b[i] : 0); }); }
  function add(a, b) { return a.map(function (x, i) { return x + b[i]; }); }
  function softmax(s, temp) { var m = Math.max.apply(null, s), e = s.map(function (x) { return Math.exp((x - m) / (temp || 1)); }),
    z = e.reduce(function (a, x) { return a + x; }, 0); return e.map(function (x) { return x / z; }); }
  function argmax(a) { var k = 0; for (var i = 1; i < a.length; i++) if (a[i] > a[k]) k = i; return k; }
  function order(a) { return a.map(function (x, i) { return i; }).sort(function (p, q) { return a[q] - a[p]; }); }
  function run(ids) {
    var T = ids.length, R = { T: T, ids: ids, B: [], lens: [] };
    R.te = ids.map(function (id) { return M.tok[id]; });
    R.pe = ids.map(function (_, t) { return M.pos[t]; });
    R.x = R.te.map(function (r, t) { return add(r, R.pe[t]); });
    var cur = R.x;
    R.lens.push(softmax(matvec(M.U, cur[T - 1])));
    M.blocks.forEach(function (Wt) {
      var o = { inp: cur, sc: [], a: [], mix: [], m: [], h: [], f: [], s: [] };
      o.q = cur.map(function (x) { return matvec(Wt.Wq, x); });
      o.k = cur.map(function (x) { return matvec(Wt.Wk, x); });
      o.v = cur.map(function (x) { return matvec(Wt.Wv, x); });
      for (var i = 0; i < T; i++) {
        var row = []; for (var j = 0; j <= i; j++) row.push(dot(o.q[i], o.k[j]));
        var w = softmax(row), mix = new Array(D).fill(0);
        for (j = 0; j <= i; j++) for (var n = 0; n < D; n++) mix[n] += w[j] * o.v[j][n];
        o.sc.push(ids.map(function (_, c) { return c <= i ? row[c] : null; }));
        o.a.push(ids.map(function (_, c) { return c <= i ? w[c] : null; }));
        o.mix.push(mix); o.m.push(add(cur[i], mix));
        o.h.push(matvec(Wt.W1, o.m[i], Wt.b1).map(function (x) { return Math.max(0, x); }));
        o.f.push(matvec(Wt.W2, o.h[i], Wt.b2)); o.s.push(add(o.m[i], o.f[i]));
      }
      R.B.push(o); cur = o.s; R.lens.push(softmax(matvec(M.U, cur[T - 1])));
    });
    R.logits = matvec(M.U, cur[T - 1]);
    return R;
  }

  /* ---- state ------------------------------------------------------------------------------ */
  function toIds(s) { return s.split(" ").map(function (w) { return VOC.indexOf(w); }); }
  var st = { ids: toIds(M.presets[0]), foc: 3, blk: 0, step: 0, temp: 1, trained: true, word: null, pair: null, unit: null, out: null };
  var R = run(st.ids), stepT0 = 0, autoPair = 0;
  function W(t) { return VOC[st.ids[t]]; }
  function tk(w) { return '<span class="tk">“' + w + '”</span>'; }
  function probs() { return softmax(R.logits, st.temp); }
  function f2(v) { var a = Math.abs(v), s = a >= 10 ? a.toFixed(1) : a.toFixed(2).replace(/^0/, ""); return (v < 0 ? "−" : "") + s; }
  function f1(v) { return (v < 0 ? "−" : "") + Math.abs(v).toFixed(2); }
  function pct(p) { var x = 100 * p; return (x > 0 && x < 1 ? "<1" : String(Math.round(x))) + "%"; }
  function big(v) { if (v >= 1e7) { var e = Math.floor(Math.log10(v)); return (v / Math.pow(10, e)).toFixed(1) + " × 10<sup>" + e + "</sup>"; } return v >= 1000 ? Math.round(v).toLocaleString("en-US") : v >= 10 ? v.toFixed(1) : v.toFixed(2); }
  function barH(p, all) { var m = Math.max.apply(null, all); return m <= .45 ? 28 * p : 12.6 * p / m; }
  function nth(n) { return ["first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth"][n]; }
  function list(a) { return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }
  function curPair() { return Math.min(st.pair != null ? st.pair : autoPair, st.foc); }
  function curUnit() { return st.unit != null ? st.unit : argmax(R.B[st.blk].h[st.foc]); }
  function curOut() { return st.out != null ? st.out : argmax(R.logits); }

  /* ---- colours ------------------------------------------------------------------------------ */
  var COL = { pos: [74, 168, 220], neg: [224, 122, 82], acc: [79, 192, 141], amber: [240, 178, 80], ink: [232, 234, 236],
              slate: [70, 96, 122], deep: [22, 44, 68], cell: [36, 62, 90], dead: [27, 50, 75], bg: [16, 36, 58] };
  function rgba(c, a) { return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")"; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function ease(t) { t = Math.max(0, Math.min(1, t)); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function clamp01(t) { return Math.max(0, Math.min(1, t)); }
  function signCol(v, max) { var u = Math.pow(Math.min(1, Math.abs(v) / (max || 1)), .75); return mix(COL.cell, v >= 0 ? COL.pos : COL.neg, .14 + .86 * u); }
  function maxAbs(m) { var x = 1e-6; m.forEach(function (r) { r.forEach(function (v) { if (v != null && Math.abs(v) > x) x = Math.abs(v); }); }); return x; }

  /* ---- the scene: floors of tiles ------------------------------------------------------------
     x runs across the tokens (a column is two units wide), z through the twelve numbers of a
     vector, y upwards. A block's floors sit at fixed offsets above its base. */
  var BH = 20, Y0 = 1.5, GAP = 3;
  var OFF = { w: .6, qkv: 3.6, sc: 7, a: 10, m: 12.5, h: 15.5, s: 18.5 };
  var floors = [], FL = {};
  function mk(o) { o.cw = o.cw || 1; o.cz = o.cz || 1; o.kind = o.kind || "sign"; o.max = maxAbs(o.v); if (o.y == null) o.y = 0; o.av = null;
    floors.push(o); FL[o.id] = o; return o; }
  function below(b) { return b === 0 ? FL.x : FL["s" + (b - 1)]; }
  function build() {
    floors = []; FL = {};
    var T = R.T, SW = 2 * T, QX = SW + 4, n12 = function (j) { return "number " + (j + 1) + " of " + D; };
    function tokTip(what) { return function (i, j, v) { return what(i) + " · " + n12(j) + '<br><span class="n">' + f1(v) + "</span>"; }; }
    mk({ id: "toktab", x0: -3 - V, y: -7, z0: 0, nx: V, nz: D, v: st.trained ? M.tok : M.tok0, vocab: true,
      tip: tokTip(function (i) { return "Embedding table, row of <b>“" + VOC[i] + "”</b> (entry " + (i + 1) + " of " + V + ")" + (st.trained ? "" : ", before training"); }) });
    mk({ id: "postab", x0: -3 - CTX, y: -3.5, z0: 0, nx: CTX, nz: D, v: M.pos,
      tip: tokTip(function (i) { return "Position table, row for the <b>" + nth(i) + "</b> token"; }) });
    mk({ id: "te", x0: 0, y: -7, z0: 0, nx: T, nz: D, cw: 2, v: R.te, tok: true, tip: tokTip(function (i) { return "The row of <b>“" + W(i) + "”</b>, copied from the embedding table"; }) });
    mk({ id: "pe", x0: 0, y: -3.5, z0: 0, nx: T, nz: D, cw: 2, v: R.pe, tok: true, tip: tokTip(function (i) { return "The row for the <b>" + nth(i) + "</b> position"; }) });
    mk({ id: "x", x0: 0, y: 0, z0: 0, nx: T, nz: D, cw: 2, v: R.x, tok: true,
      tip: function (i, j, v) { return "Input vector of <b>“" + W(i) + "”</b> · " + n12(j) + '<br><span class="n">' + f1(R.te[i][j]) + " + " + f1(R.pe[i][j]) + " = " + f1(v) + "</span>"; } });
    R.B.forEach(function (o, b) {
      var bn = "block " + (b + 1), Wt = M.blocks[b];
      function wt(id, name, x, mat) { mk({ id: id + b, block: b, off: OFF.w, x0: x + T - 3, z0: 3, nx: D, nz: D, cw: .5, cz: .5, v: mat, w: true,
        tip: function (i, j, v) { return name + " weights, " + bn + " · row " + (i + 1) + ", column " + (j + 1) + '<br><span class="n">' + f1(v) + "</span> (learned)"; } }); }
      wt("wq", "Query", QX, Wt.Wq); wt("wk", "Key", QX + SW + GAP, Wt.Wk); wt("wv", "Value", QX + 2 * (SW + GAP), Wt.Wv);

  { ch: 2, title: "From scores to shares",

  { ch: 2, title: "Mixing the values",

  { ch: 3, title: "A layer of 48 detectors",

      tag("1 · SCORES", function () { return [FL.sco.x0, FL.sco.y, 6]; }, "t", "right", -10, 4);
      tag("2 · e TO THE SCORE", function () { return [FL.exp.x0, FL.exp.y, 6]; }, "t", "right", -10, 4);
      tag("3 · PROBABILITIES", function () { return [FL.prb.x0, FL.prb.y, 6]; }, "a", "right", -10, 4);
    },
    html: function () { return "<p>The softmax turns the " + V + " scores into probabilities in two moves, drawn as two rows of bars.</p>" +
      "<p>First, e (about 2.72) is raised to the power of each score. Every result is positive, and one point more in the score makes the result 2.72 times as large: differences between scores become ratios.</p>" +
      "<p>Second, each result is divided by the sum of all " + V + ". The shares add up to 100%.</p>" +
      "<p>The <b>temperature</b> divides the scores before the softmax. Below 1 the top word takes nearly everything; above 1 the distribution flattens. At temperature 0, the setting used in the labs, the model always takes the top word.</p>"; },
    card: function () { return '<div class="formula"><span>p(word) =</span><span class="frac"><span>e<sup>score of the word' + '</sup></span><span>sum of e<sup>score</sup> over all ' + V + " words</span></span></div>" +
      '<div class="row" style="margin-bottom:2px"><span class="k">Temperature</span><span id="tempv" style="font-family:var(--mono);font-size:12px">' + st.temp.toFixed(1) + '</span></div><input type="range" id="temp" min="0.2" max="2" step="0.1" value="' + st.temp + '" aria-label="Temperature"><div id="dyn">' + softTable() + "</div>"; } },

  { ch: 5, title: "One word, then run again",
    cam: function () { return { ids: ["s" + (L - 1), "ut", "sco", "exp", "prb"], up: { exp: 5, prb: 12 }, yaw: -.3, pitch: .3 }; },
    show: function () { var o = { ut: .3, sco: .5, exp: .5, prb: 1 }; o["s" + (L - 1)] = 1; return o; },
    tags: function () { outTags(); tokTags(FL["s" + (L - 1)], 14, { plain: true });
      tag("THE NEXT WORD", function () { return [FL.prb.x0, FL.prb.y, 6]; }, "a", "right", -10, 4); },
    html: function () { return "<p>The distribution is all the model gives. To write text, one word is drawn from it: the most probable one, or a random one in proportion to the probabilities.</p>" +
      "<p>The word is appended to the prompt and the whole model runs again on the longer prompt. A chat model writes its answer this way, one token per run.</p>" +
      "<p>This toy reads at most eight tokens. When the prompt is full, the oldest token drops out and the model no longer knows it was there. GPT-3 could read 2,048 tokens, Llama 3.1 reads 128,000.</p>"; },
    card: function () { var p = probs(), o = order(p).slice(0, 5);
      return '<span class="k">Append a word to “' + sentence() + '”</span><div class="row">' + o.map(function (i) { return '<button class="btn" data-act="append" data-v="' + i + '">' + VOC[i] + " " + pct(p[i]) + "</button>"; }).join("") + "</div>" +
        '<div class="row"><button class="btn go" data-act="sample">Draw one at random</button><button class="btn" data-act="reset">Start over</button></div>' +
        "<small>" + (st.ids.length >= CTX ? "The prompt is full: the next word pushes “" + W(0) + "” out." : "After a full stop the model has seen nothing in training, so what follows there means little.") + (st.temp !== 1 ? " Temperature is " + st.temp.toFixed(1) + " (set in the previous step)." : "") + "</small>"; } },

  { ch: 6, title: "The same machine, much larger",
    cam: function () { var T = R.T; return { boxes: [[-2, -8, -7, 8 * T + 12, Y0 + BIG * 4 + 2, 19]], bh: 4, yaw: -.42, pitch: .3 }; },
    rest: 1, show: function () { return { ut: 0, sco: 0, exp: 0, prb: 0 }; },
    post: function (at) { var g = reduced ? 1 : ease((at - .9) / 2.6), nb = L + (BIG - L) * g, T = R.T, SW = 2 * T, QX = SW + 4, k = cam.bh / BH;
      for (var b = L; b < BIG; b++) { var a = clamp01(nb - b); if (a <= 0) break; var y = yb(b, cam.bh), gl = Math.max(0, 1 - Math.abs(nb - 1 - b) / 1.5) * (g < 1 ? 1 : 0);
        slab(QX, y + OFF.qkv * k, 0, 3 * SW + 2 * GAP, D, a, gl); slab(QX, y + OFF.h * k, -6, SW, 24, a, gl); slab(0, y + OFF.s * k, 0, SW, D, a, gl); }
      bigDone = g > .97; },
    tags: function () {
      tag("THE TOY · 3 BLOCKS", function () { return [-1, FL["s" + (L - 1)].y, 0]; }, "t", "right", -10, 4);
      tag("LLAMA 3.1 8B · 32 BLOCKS", function () { return [-1, yb(BIG - 1, cam.bh) + OFF.s * cam.bh / BH, 0]; }, "a", "right", -10, 4, { alpha: function () { return bigDone ? 1 : 0; } });
    },
    html: function () { return "<p>Llama 3.1 8B, a model small enough to run on a laptop, has 32 of these blocks, 4,096 numbers per token and a vocabulary of 128,256 tokens. GPT-3 (2020) had 96 blocks.</p>" +
      "<p>What the toy leaves out: real models run several attention heads side by side in each block, each with its own queries, keys and values; they rescale the vectors before each part of a block; and their tokens are pieces of words. The steps are the ones you have walked through.</p>" +
      "<p>The rest is size and training text: billions of weights, learned from a large part of the written internet in place of " + M.n_sentences.toLocaleString("en-US") + " invented sentences.</p>"; },
    card: function () { var r = function (a) { return "<tr><td>" + a[0] + "</td><td>" + a[1] + "</td><td>" + a[2] + "</td><td>" + a[3] + "</td></tr>"; };
      return '<table class="t"><tr><th></th><th>this toy</th><th>GPT-3</th><th>Llama 3.1 8B</th></tr>' +
        [["numbers per token", D, "12,288", "4,096"], ["blocks", L, "96", "32"], ["heads per block", 1, "96", "32"], ["vocabulary", V, "50,257", "128,256"], ["longest prompt", CTX, "2,048", "128,000"],
         ["weights", M.n_weights.toLocaleString("en-US"), "175 billion", "8 billion"]].map(r).join("") + "</table><small>GPT-3: Brown et al. (2020). For GPT-4 and later models, OpenAI has not published these numbers.</small>" + replayBtn(); } }
  ];
  var CHAPTERS = ["The model", "Input", "Attention", "Feed-forward", "Blocks", "Output", "Real size"], bigDone = false;
  function nbWord() { return st.word != null ? st.word : st.ids[st.foc]; }
  function sweep() { if (reduced) return D; var at = (performance.now() - stepT0) / 1000 - .5; return at < 0 ? -1 : Math.floor(at / .3); }
  function outTags() { var p = probs(), o = order(p), top = o.slice(0, 5);
    top.forEach(function (i, n) { if (n && p[i] < .04) return; tag(n ? pct(p[i]) : VOC[i] + " " + pct(p[i]), function () { return [FL.prb.x0 + i + .5, FL.prb.y + barH(probs()[i], probs()), 6]; }, n ? "sm" : "big", "center", 0, -7); });
    vocTags(FL.prb, VOC.map(function (_, i) { return i; })); }
  function softTable() { var p = probs(), o = order(p), ex = R.logits.map(function (s) { return Math.exp(s / st.temp); }), z = ex.reduce(function (a, x) { return a + x; }, 0), n = 6,

    return '<table class="t"><tr><th>word</th><th>score</th><th>e<sup>score' + (st.temp !== 1 ? " ÷ " + st.temp.toFixed(1) : "") + "</sup></th><th>probability</th></tr>" +
      o.slice(0, n).map(function (i) { return "<tr><td>" + VOC[i] + "</td><td>" + f1(R.logits[i]) + "</td><td>" + big(ex[i]) + "</td><td>" + (100 * p[i]).toFixed(1) + "%</td></tr>"; }).join("") +
      '<tr class="dim"><td>' + (V - n) + " more words</td><td></td><td>" + big(restE) + "</td><td>" + (100 * restP).toFixed(1) + '%</td></tr><tr class="sum"><td>together</td><td></td><td>' + big(z) + "</td><td>100%</td></tr></table>"; }

  /* ---- one frame ------------------------------------------------------------------------------------- */
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden || !cam) return;
    tweenCam(now);
    sway = reduced || userMoved || hov ? sway * .9 : .07 * Math.sin(now / 4200);
    place(cam.sp, cam.bh);
    var S_ = STEPS[st.step], at = reduced ? 1e3 : (now - stepT0) / 1000, sh = S_.show ? S_.show() : {}, rest = S_.rest != null ? S_.rest : .1;
    floors.forEach(function (F) { var a = sh[F.id] != null ? sh[F.id] : (F.w ? 0 : rest); F.av = F.av == null || reduced ? a : F.av + (a - F.av) * .14; F.glow = 0; });

    var p = probs(), ex = FL.exp.v, exm = maxAbs(ex), grow = st.step >= 14 ? ease((at - .3) / .9) : 1, hot = argmax(p);
    floors.filter(function (F) { return F.av > .01; }).map(function (F) { F._z = P(ctr(F)).z; return F; })
      .sort(function (a, b) { return a.y - b.y || b._z - a._z; })
      .forEach(function (F) {

      });

  }

  /* ---- panel, prompt, navigation ----------------------------------------------------------------------- */
  function renderCard() { var S_ = STEPS[st.step]; $("body").innerHTML = S_.html(); var c = S_.card ? S_.card() : ""; $("card").innerHTML = c ? '<div class="card">' + c + "</div>" : ""; rebuildTags(); }
  function rebuildTags() { tags = []; STEPS[st.step].tags(); }
  function renderPanel() { var S_ = STEPS[st.step]; $("kick").textContent = CHAPTERS[S_.ch]; $("title").textContent = S_.title; renderCard(); $("panel").scrollTop = 0; }
  function renderPrompt() {
    $("prompt").innerHTML = st.ids.map(function (id, t) { return '<button class="btn tokb" data-t="' + t + '" aria-pressed="' + (t === st.foc) + '" title="Follow this token">' + VOC[id] + "</button>"; }).join("");
    $("delBtn").disabled = st.ids.length < 2;
    $("presets").value = M.presets.indexOf(sentence()) >= 0 ? sentence() : "";
  }
  function renderNav() {
    var html = "";
    CHAPTERS.forEach(function (name, c) { var on = STEPS[st.step].ch === c, first = -1, dots = "";
      STEPS.forEach(function (S_, n) { if (S_.ch !== c) return; if (first < 0) first = n; dots += '<i data-go="' + n + '" class="' + (n === st.step ? "on" : n < st.step ? "done" : "") + '" title="' + S_.title + '"></i>'; });
      html += '<button class="ch' + (on ? " on" : "") + '" data-go="' + first + '"><span>' + name + '</span><div class="dots">' + dots + "</div></button>"; });
    $("rail").innerHTML = html; $("count").textContent = (st.step + 1) + " / " + STEPS.length;
    $("prev").disabled = st.step === 0; $("next").disabled = st.step === STEPS.length - 1;
  }
  function go(n, snap) {
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    st.step = n; stepT0 = performance.now(); st.pair = null; st.unit = null; autoPair = 0; bigDone = false;
    if (n !== 2 && !st.trained) { st.trained = true; rerun(true); }
    stepCam(snap); renderPanel(); renderNav();
    try { history.replaceState(null, "", "#" + n); } catch (e) { /* file:// in some browsers */ }
  }
  /* run the model again (new prompt, or a switch that changes what a floor shows) */
  function rerun(keepCam) {
    var old = FL; R = run(st.ids); st.foc = Math.min(st.foc, R.T - 1); build();
    floors.forEach(function (F) { if (old[F.id]) F.av = old[F.id].av; });
    if (cam) place(cam.sp, cam.bh);
    renderPrompt();
    if (!keepCam && cam) { stepCam(false); renderPanel(); }
  }
  function setIds(ids) { st.ids = ids; st.foc = ids.length - 1; st.out = null; st.unit = null; st.pair = null; st.word = null; stepT0 = performance.now(); rerun(); }
  function setFoc(t) { st.foc = t; st.pair = null; st.unit = null; st.word = null; autoPair = 0; stepT0 = performance.now(); renderPrompt(); renderPanel(); }
  function append(id) { var ids = st.ids.concat([id]); if (ids.length > CTX) ids = ids.slice(ids.length - CTX); setIds(ids); }

  $("prompt").addEventListener("click", function (e) { var b = e.target.closest("[data-t]"); if (b) setFoc(+b.getAttribute("data-t")); });
  $("delBtn").addEventListener("click", function () { if (st.ids.length > 1) setIds(st.ids.slice(0, -1)); });
  $("popList").innerHTML = VOC.map(function (w, i) { return '<button class="btn" data-v="' + i + '">' + w + "</button>"; }).join("");
  $("addBtn").addEventListener("click", function (e) { e.stopPropagation(); $("pop").classList.toggle("open"); });
  $("popList").addEventListener("click", function (e) { var b = e.target.closest("[data-v]"); if (b) { append(+b.getAttribute("data-v")); $("pop").classList.remove("open"); } });
  document.addEventListener("click", function () { $("pop").classList.remove("open"); });
  $("presets").innerHTML = '<option value="">Example prompts…</option>' + M.presets.map(function (p) { return '<option value="' + p + '">' + p + "</option>"; }).join("");
  $("presets").addEventListener("change", function () { if (this.value) setIds(toIds(this.value)); });
  $("prev").addEventListener("click", function () { go(st.step - 1); });
  $("next").addEventListener("click", function () { go(st.step + 1); });
  $("rail").addEventListener("click", function (e) { var b = e.target.closest("[data-go]"); if (b) go(+b.getAttribute("data-go")); });
  $("card").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
    var act = b.getAttribute("data-act"), v = +b.getAttribute("data-v");
    if (act === "blk") { st.blk = v; st.unit = null; stepT0 = performance.now(); stepCam(false); renderPanel(); }
    else if (act === "pair") { st.pair = v; renderCard(); }
    else if (act === "unit") { st.unit = v; renderCard(); }
    else if (act === "out") { st.out = v; renderCard(); }
    else if (act === "trained") { st.trained = !!v; rerun(true); renderCard(); }
    else if (act === "replay") { st.pair = null; autoPair = 0; stepT0 = performance.now(); renderCard(); }
    else if (act === "append") append(v);
    else if (act === "reset") setIds(toIds(M.presets[0]));
    else if (act === "sample") { var p = probs(), r = Math.random(), i = 0; while (i < V - 1 && (r -= p[i]) > 0) i++; append(i); }
  });
  $("card").addEventListener("change", function (e) { if (e.target.getAttribute("data-act") === "word") { st.word = +e.target.value; renderCard(); } });
  $("card").addEventListener("input", function (e) { if (e.target.id !== "temp") return;
    st.temp = +e.target.value; $("tempv").textContent = st.temp.toFixed(1); rerun(true); $("dyn").innerHTML = softTable(); rebuildTags(); });
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(st.step + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(st.step - 1); }
  });
  window.addEventListener("hashchange", function () { var n = parseInt(location.hash.slice(1), 10); if (!isNaN(n) && n !== st.step) go(n); });

  /* ---- the free camera: turn, move, zoom, read, pick --------------------------------------------------- */
  function inQuad(x, y, q) { var s = 0; for (var i = 0; i < 4; i++) { var a = q[i], b = q[(i + 1) % 4], c = (b.x - a.x) * (y - a.y) - (b.y - a.y) * (x - a.x); if (c === 0) continue; if (s === 0) s = c > 0 ? 1 : -1; else if ((c > 0 ? 1 : -1) !== s) return false; } return true; }
  function hit(x, y) {
    var vis = floors.filter(function (F) { return F.av > .08; }).sort(function (a, b) { return b.y - a.y || a._z - b._z; });
    for (var n = 0; n < vis.length; n++) { var F = vis[n], g = grid(F);
      if (!inQuad(x, y, [g[0][0], g[F.nx][0], g[F.nx][F.nz], g[0][F.nz]])) continue;
      for (var i = 0; i < F.nx; i++) for (var j = 0; j < F.nz; j++) if (inQuad(x, y, [g[i][j], g[i + 1][j], g[i + 1][j + 1], g[i][j + 1]])) return { F: F, i: i, j: j };
    }
    return null;
  }
  function tagAt(x, y) { for (var i = tagBoxes.length - 1; i >= 0; i--) { var b = tagBoxes[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.t; } return null; }
  function zoomAt(f, x, y) { f = Math.max(1.2 / cam.S, Math.min(90 / cam.S, f)); camFrom = null; userMoved = true; cam.S *= f; cam.cx = x - (x - cam.cx) * f; cam.cy = y - (y - cam.cy) * f; }
  var ptrs = {}, drag = null, active = !framed, tip = $("tip");
  function local(e) { var r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  stage.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".view")) return;
    var p = local(e); ptrs[e.pointerId] = p; active = true; stage.setPointerCapture(e.pointerId);
    var ids = Object.keys(ptrs);
    if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; drag = { pinch: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, moved: 9 }; }
    else drag = { x: p.x, y: p.y, pan: e.shiftKey || e.button === 2 || e.button === 1, moved: 0 };
    tip.style.display = "none";
  });
  stage.addEventListener("pointermove", function (e) {
    var p = local(e);
    if (drag && ptrs[e.pointerId]) {
      ptrs[e.pointerId] = p; var ids = Object.keys(ptrs);
      if (drag.pinch && ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        zoomAt(d / drag.pinch, mx, my); cam.cx += mx - drag.mx; cam.cy += my - drag.my; drag.pinch = d; drag.mx = mx; drag.my = my; return; }
      if (drag.pinch) return;
      var dx = p.x - drag.x, dy = p.y - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = p.x; drag.y = p.y;
      if (drag.moved < 4) return;
      camFrom = null; userMoved = true; stage.classList.add("drag");
      if (drag.pan) { cam.cx += dx; cam.cy += dy; } else { cam.yaw -= dx * .006; cam.pitch = Math.max(.05, Math.min(1.5, cam.pitch + dy * .005)); }
      return;
    }
    if (e.pointerType === "touch") return;
    var t = tagAt(p.x, p.y); hov = t ? null : hit(p.x, p.y);
    stage.classList.toggle("pt", !!t || !!(hov && (hov.F.tok || hov.F.vocab)));
    if (hov) { var v = hov.F.v[hov.i][hov.j]; tip.innerHTML = hov.F.tip(hov.i, hov.j, v); tip.style.display = "block";
      var tw = tip.offsetWidth, thh = tip.offsetHeight; tip.style.left = Math.max(4, Math.min(Wd - tw - 4, p.x + 14)) + "px"; tip.style.top = Math.max(4, p.y - thh - 10) + "px"; }
    else tip.style.display = "none";
  });
  function up(e) {
    var p = local(e), was = drag; delete ptrs[e.pointerId]; if (!Object.keys(ptrs).length) drag = null; stage.classList.remove("drag");
    if (!was || was.pinch || was.moved >= 4 || e.type !== "pointerup") return;
    var t = tagAt(p.x, p.y);
    if (t) { if (t.click) t.click(); else go(t.go); return; }
    var h = hit(p.x, p.y); if (!h) return;
    if (h.F.pairs) { st.foc = h.i; if (h.j <= h.i) st.pair = h.j; renderPrompt(); renderPanel(); }
    else if (h.F.tok) { if (h.F.units && h.F.v[h.i][h.j] > 0) { st.foc = h.i; st.unit = h.j; renderPrompt(); renderPanel(); } else setFoc(h.i); }
    else if (h.F.id === "toktab") { st.word = h.i; renderCard(); }
    else if (h.F.vocab) { st.out = h.i; renderCard(); }
  }
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  stage.addEventListener("pointerleave", function () { hov = null; tip.style.display = "none"; if (framed && !drag) active = false; });
  stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  stage.addEventListener("wheel", function (e) {
    /* inside a page, the wheel belongs to the page until the model has been clicked (or pinched) */
    if (!active && !e.ctrlKey) { var h = $("hint"); h.textContent = "click the model first, then scroll to zoom"; h.classList.add("flash"); setTimeout(function () { h.classList.remove("flash"); }, 1200); return; }
    e.preventDefault(); var p = local(e); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .012 : .0022)), p.x, p.y);
  }, { passive: false });
  stage.addEventListener("dblclick", function (e) { if (e.target.closest(".view")) return; var p = local(e), h = hit(p.x, p.y); if (!h) return;
    var c = fit({ boxes: [boxOf(h.F, 1)], yaw: cam.yaw, pitch: cam.pitch, sp: cam.sp, bh: cam.bh, pad: [90, 80, 90, 90] }); userMoved = true; flyTo(c); });
  $("zIn").addEventListener("click", function () { zoomAt(1.35, Wd / 2, Hd / 2); });
  $("zOut").addEventListener("click", function () { zoomAt(1 / 1.35, Wd / 2, Hd / 2); });
  $("zReset").addEventListener("click", function () { stepCam(false); });

  /* ---- start ---------------------------------------------------------------------------------------------- */
  build(); renderPrompt();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
  var r0 = stage.getBoundingClientRect(); Wd = r0.width || 800; Hd = r0.height || 600;
  cv.width = Math.round(Wd * (window.devicePixelRatio || 1)); cv.height = Math.round(Hd * (window.devicePixelRatio || 1)); ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  go(parseInt((location.hash || "").slice(1), 10) || 0, true);
  if (reduced) stepT0 = -1e7;
  requestAnimationFrame(frame);
})();
</script>
