<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside a small neural network — CADC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  /* --- tokens ---------------------------------------------------------------
     A dark stage in both colour schemes, like the lecture figures it grew out
     of (explainers/network, explainers/descent) and like its week 4 sibling
     (explainers/tinygpt). Blue and orange are the sign of a number, green is
     the accent, amber marks the gradient and the one thing a step is about. */
  :root{
    --bg:#10243a; --panel:#142c44; --surface:#16304a; --strip:#1b3550; --hair:#2c4560;
    --ink:#e8eaec; --ink-2:#cfd6de; --ink-3:#a8c0d4; --muted:#7d9bb5; --faint:#4e6a86;
    --accent:#4fc08d; --amber:#f0b250; --pos:#4aa8dc; --neg:#e07a52;
    --font:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{font-family:var(--font); background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; overflow:hidden}
  button,select,input{font:inherit; color:inherit}
  .app{display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto; height:100vh; height:100dvh; min-height:400px}

  /* --- top: the review ------------------------------------------------------ */
  .top{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--hair); background:var(--panel)}
  .k{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .btn{font-size:12px; padding:4px 9px; cursor:pointer; border:1px solid var(--hair); border-radius:6px; background:var(--surface); color:var(--ink-2)}
  .btn:hover:not(:disabled){border-color:var(--accent); color:var(--ink)}
  .btn:disabled{opacity:.4; cursor:default}
  .btn[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:#0c1c2c; font-weight:700}
  .btn.go{background:var(--accent); border-color:var(--accent); color:#0c1c2c; font-weight:700}
  .btn.go:hover:not(:disabled){color:#0c1c2c; filter:brightness(1.08)}
  .top select, .top input[type=text]{font-size:12px; padding:4px 6px; border:1px solid var(--hair); border-radius:6px; background:var(--surface); color:var(--ink-2)}
  .top select{max-width:230px} .top input[type=text]{width:190px}
  .top input[type=text]::placeholder{color:var(--muted)}
  .top input[type=text]:focus, .top select:focus{outline:none; border-color:var(--accent)}
  .spacer{flex:1 1 0}
  .status{font-size:11.5px; color:var(--ink-3); white-space:nowrap} .status b{color:var(--ink); font-family:var(--mono); font-weight:700}
  #ownlab{display:none; gap:4px; align-items:center} #ownlab.on{display:inline-flex}

  /* --- the stage and the panel ---------------------------------------------- */
  .main{display:grid; grid-template-columns:minmax(0,1fr) 410px; min-height:0}
  .stage{position:relative; min-height:0; overflow:hidden; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
  .stage.drag{cursor:grabbing}
  .stage.pt{cursor:pointer}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  .tip{position:absolute; z-index:3; pointer-events:none; max-width:250px; padding:6px 9px; font-size:11.5px; line-height:1.4;
       background:rgba(10,24,40,.94); border:1px solid var(--hair); border-radius:6px; color:var(--ink-2); display:none}
  .tip b{color:var(--ink)} .tip .n{font-family:var(--mono); color:var(--amber); font-weight:700}
  .view{position:absolute; right:10px; top:10px; display:flex; gap:4px; z-index:2}
  .view .btn{background:rgba(22,48,74,.85); min-width:30px}
  .legend{position:absolute; left:12px; bottom:9px; z-index:2; font-size:10.5px; color:var(--muted); pointer-events:none; display:flex; flex-wrap:wrap; gap:3px 12px; max-width:calc(100% - 24px)}
  .legend i{display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:4px; vertical-align:3px}
  .legend .hint{transition:color .3s} .legend .hint.flash{color:var(--amber)}

  .panel{border-left:1px solid var(--hair); background:var(--panel); overflow-y:auto; padding:16px 18px 22px; min-height:0}
  .panel .kick{font-size:10.5px; font-weight:700; letter-spacing:.1em; color:var(--accent); text-transform:uppercase}
  .panel h2{font-size:19px; line-height:1.25; margin:3px 0 10px; font-weight:700}
  .panel p{margin:0 0 9px; color:var(--ink-2); font-size:13.5px}
  .panel p b{color:var(--ink)} .tk{color:var(--ink); font-weight:700}
  .panel .a{color:var(--accent); font-weight:700} .panel .m{color:var(--amber); font-weight:700}
  .panel .p{color:var(--pos); font-weight:700} .panel .n{color:var(--neg); font-weight:700}
  .num{font-family:var(--mono); color:var(--ink); font-weight:700; white-space:nowrap}
  .card{margin-top:14px; padding:11px 12px 12px; background:var(--surface); border:1px solid var(--hair); border-radius:8px}
  .card > .k{display:block; margin-bottom:7px}
  .card .row{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-bottom:9px}
  .card .row .k{margin:0 4px 0 0}
  .card small, .panel small.note{display:block; color:var(--muted); font-size:11.5px; margin-top:7px; line-height:1.45}
  .res{margin-top:8px; font-size:12.5px; color:var(--ink-2)} .res b{font-family:var(--mono); color:var(--amber)}
  table.t{width:100%; border-collapse:collapse; font-size:12px}
  table.t th{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:right; padding:2px 4px 4px; border-bottom:1px solid var(--hair)}
  table.t td{padding:3px 4px; text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--ink-2); border-bottom:1px solid rgba(44,69,96,.5)}
  table.t th:first-child, table.t td:first-child{text-align:left; font-family:var(--font); font-weight:700; color:var(--ink)}
  table.t tr.sum td{border-bottom:0; color:var(--ink); font-weight:700}
  table.t tr.dim td, table.t tr.dim td:first-child{color:var(--muted); font-weight:400}
  table.t tr.pick{cursor:pointer} table.t tr.pick:hover td{background:rgba(79,192,141,.08)}
  table.t tr.on td:first-child{color:var(--accent)}
  table.t td .p, table.t td .n, table.t td .a, table.t td .m{font-weight:700}
  table.t td.l{text-align:left} table.t td.txt{font-family:var(--font)}
  .formula{font-family:var(--mono); font-size:12.5px; color:var(--ink); margin:2px 0 10px}
  input[type=range]{width:100%; accent-color:var(--accent); margin:2px 0 8px; cursor:pointer}
  .toks{display:flex; flex-wrap:wrap; gap:4px}
  .toks span{font-size:12px; padding:3px 8px; border-radius:6px; border:1px dashed var(--faint); color:var(--muted)}
  .toks span.in{border:1px solid var(--accent); color:var(--ink); font-weight:700}
  .dotrow{display:flex; gap:3px; margin-top:8px}
  .dotrow i{flex:1 1 0; height:14px; border-radius:3px; background:var(--neg); cursor:pointer; opacity:.9}
  .dotrow i.ok{background:var(--accent)} .dotrow i.me{outline:2px solid var(--ink); outline-offset:1px}
  svg.pl{display:block; width:100%; height:auto; margin-top:4px}
  .pl .ax{stroke:var(--faint); stroke-width:1} .pl .gr{stroke:var(--faint); stroke-width:1; stroke-dasharray:3 4}
  .pl .fn{fill:none; stroke:var(--accent); stroke-width:2} .pl .fn.dim{stroke:var(--faint); stroke-width:1.5}
  .pl .tan{stroke:var(--amber); stroke-width:1.6} .pl .gd{stroke:var(--accent); stroke-width:1.1; stroke-dasharray:3 3}
  .pl text{font-size:10.5px; fill:var(--muted); font-family:var(--font)} .pl text.v{font-size:12px; font-weight:700; fill:var(--accent)}
  .pl text.v.m{fill:var(--amber)} .pl text.v.n{fill:var(--neg)}
  .pl .pt{fill:var(--accent)} .pl .pt.m{fill:var(--amber)} .pl .pt.n{fill:var(--neg)}
  .pl .bar{fill:var(--faint); cursor:pointer} .pl .bar.me{fill:var(--neg)} .pl .bar:hover{fill:var(--ink-3)}
  .sw{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:0}

  /* --- bottom: the steps ----------------------------------------------------- */
  .nav{display:flex; gap:10px; align-items:center; padding:8px 14px; border-top:1px solid var(--hair); background:var(--panel)}
  .rail{flex:1 1 0; display:flex; gap:5px; min-width:0; overflow-x:auto; scrollbar-width:none}
  .ch{flex:1 1 0; min-width:max-content; padding:4px 8px 5px; border-radius:6px; border:1px solid transparent; cursor:pointer; background:none; text-align:left}
  .ch:hover{border-color:var(--hair)}
  .ch.on{background:var(--surface); border-color:var(--hair)}
  .ch span{display:block; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
  .ch.on span{color:var(--accent)}
  .dots{display:flex; gap:4px; margin-top:4px}
  .dots i{width:14px; height:4px; border-radius:2px; background:var(--faint); cursor:pointer}
  .dots i:hover{background:var(--ink-3)} .dots i.on{background:var(--accent)} .dots i.done{background:var(--muted)}
  .count{font-size:11.5px; color:var(--muted); white-space:nowrap; min-width:48px; text-align:center}

  @media (max-width: 860px){
    .main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(230px,46%) minmax(0,1fr)}
    .panel{border-left:0; border-top:1px solid var(--hair)}
    .ch span{display:none} .ch{min-width:0; padding:6px 4px} .dots{margin:0}
    .legend .hint{display:none} .status{display:none}
    .top input[type=text]{width:140px}
  }
</style>
</head>
<!-- ===========================================================================
  PLAYGROUND, WEEK 3 — the lecture's small network (explainers/learning and
  explainers/network) as a tool to walk through, with the loss landscape of
  explainers/descent built in. The lecture figures stay as they are; this page
  shares no code with them and repeats the model so that it is self-contained.

  What is real: everything. The network is the lecture's (15 word counts in,
  4 tanh units, one logistic output, cross-entropy, full-batch gradient
  descent, same twenty reviews, same seeded start), trained in the browser on
  load: 300 epochs are recorded so any epoch can be shown. With the default
  settings (4 units, learning rate 0.6, start 1) the run is the lecture's run.
  Every sum, probability, loss, slope and step on the page is computed from
  the weights on screen for the review on screen; no number is written into
  the text. The loss landscape is the average loss of this network over two of
  its weights with all others held where they are, and the walks on it are
  gradient descent on those two weights.

  What the toy leaves out is said in the last step: batches, a penalty,
  more layers, a test set. The comparison there is with the network deck 3
  fits with mlp() (1,000 inputs, 16 hidden units, 3 classes).

  Twenty-one steps in eight chapters; #N opens step N. The camera flies to each
  step's view and is free at any time (drag, wheel, pinch).
=========================================================================== -->
<body>
<div class="app">
  <div class="top">
    <span class="k">Review</span>
    <select id="rev" aria-label="Choose one of the twenty training reviews"></select>
    <input type="text" id="own" maxlength="70" placeholder="or type your own review" aria-label="Type your own review" autocomplete="off" spellcheck="false">
    <span id="ownlab"><span class="k">Your label</span>
      <button class="btn" data-lab="0">negative</button><button class="btn" data-lab="1">positive</button></span>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="c" role="img" aria-label="A small neural network drawn in three dimensions. Fifteen input units, one per word, stand on the left, a hidden layer of units in the middle and one output unit on the right. Lines between the units are the weights. In the chapters on gradient descent the drawing shows the loss as a surface over two weights. The panel beside the drawing explains each step in text."></canvas>
      <div class="view">
        <button class="btn" id="zOut" title="Zoom out" aria-label="Zoom out">−</button>
        <button class="btn" id="zIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="btn" id="zReset" title="Back to this step's view">Reset view</button>
      </div>
      <div class="legend"><span><i style="background:var(--pos)"></i>positive</span><span><i style="background:var(--neg)"></i>negative</span><span>thicker = further from zero</span>
        <span class="hint" id="hint">drag to turn · scroll to zoom · shift-drag to move · hover for numbers</span></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="panel" id="panel" aria-live="polite">
      <div class="kick" id="kick"></div>
      <h2 id="title"></h2>
      <div id="body"></div>
      <div id="card"></div>
    </div>
  </div>
  <div class="nav">
    <button class="btn" id="prev">‹ Back</button>
    <div class="rail" id="rail"></div>
    <span class="count" id="count"></span>
    <button class="btn go" id="next">Next ›</button>
  </div>
</div>
<noscript><p style="max-width:34em;margin:2em;font-family:sans-serif;color:#fff">This tool needs JavaScript: it trains a small neural network in your browser and draws it.</p></noscript>

<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var framed = window.top !== window.self;

  /* ---- the data: the lecture's twenty reviews and fifteen words ------------------------------ */
  var REVIEWS = [
    ["Good, really good.", 1], ["Not good at all.", 0], ["A great cast.", 1], ["Not funny.", 0],
    ["Great fun.", 1], ["Dull and slow.", 0], ["Brilliant and funny.", 1], ["Boring.", 0],
    ["Funny and warm.", 1], ["A boring, slow mess.", 0], ["Loved every minute.", 1], ["Never good.", 0],
    ["Not boring at all.", 1], ["Not great, not funny.", 0], ["Never dull.", 1], ["Slow and dull.", 0],
    ["Good fun, great cast.", 1], ["A mess.", 0], ["Warm and brilliant.", 1], ["Not brilliant.", 0]
  ];
  var VOCAB = ["good", "great", "fun", "funny", "brilliant", "warm", "loved", "cast", "not", "never", "boring", "dull", "slow", "mess", "really"];
  var NV = VOCAB.length, N = REVIEWS.length, MAXEP = 300, LETTERS = "ABCDEFGH";
  function tokens(s) { return s.toLowerCase().replace(/[^a-z ]/g, " ").split(/\s+/).filter(Boolean); }
  function featurise(s) { var x = VOCAB.map(function () { return 0; }); tokens(s).forEach(function (w) { var i = VOCAB.indexOf(w); if (i >= 0) x[i] += 1; }); return x; }
  var X = REVIEWS.map(function (r) { return featurise(r[0]); }), Y = REVIEWS.map(function (r) { return r[1]; });
  var NG = 1, NB = 12;                                    /* "Not good at all." and "Not boring at all." */

  /* ---- the arithmetic: the network, its loss, its gradient, its training ---------------------
     Kept in step with explainers/shared/mlp.js (same generator, same order of draws, same
     update), so the default run here is the run the lecture shows. */
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function init(H, seed) {
    var r = rng(seed), s = .9, W1 = [], b1 = [], W2 = [], b2 = (r() * 2 - 1) * s;
    for (var h = 0; h < H; h++) { W1.push(VOCAB.map(function () { return (r() * 2 - 1) * s; })); b1.push((r() * 2 - 1) * s); W2.push((r() * 2 - 1) * s); }
    return { W1: W1, b1: b1, W2: W2, b2: b2 };
  }
  function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }
  function forward(p, x) {
    var H = p.W1.length, z1 = [], a1 = [], z2 = p.b2;
    for (var h = 0; h < H; h++) { var s = p.b1[h]; for (var i = 0; i < NV; i++) s += p.W1[h][i] * x[i]; z1.push(s); a1.push(Math.tanh(s)); z2 += p.W2[h] * a1[h]; }
    return { z1: z1, a1: a1, z2: z2, out: sigmoid(z2) };
  }
  function lossOf(o, y) { return -(y * Math.log(o + 1e-9) + (1 - y) * Math.log(1 - o + 1e-9)); }
  /* backpropagation for one review: the error at the output, each unit's share, a slope per weight */
  function gradOne(p, x, y) {
    var f = forward(p, x), H = p.W1.length, d2 = f.out - y, g = { f: f, d2: d2, d1: [], gW1: [], gb1: [], gW2: [], gb2: d2 };
    for (var h = 0; h < H; h++) { var d1 = d2 * p.W2[h] * (1 - f.a1[h] * f.a1[h]); g.d1.push(d1); g.gb1.push(d1); g.gW2.push(d2 * f.a1[h]);
      g.gW1.push(x.map(function (xi) { return d1 * xi; })); }
    return g;
  }
  function gradAvg(p) {
    var H = p.W1.length, G = { gW1: p.W1.map(function () { return VOCAB.map(function () { return 0; }); }), gb1: p.b1.map(function () { return 0; }), gW2: p.W2.map(function () { return 0; }), gb2: 0 };
    for (var n = 0; n < N; n++) { var g = gradOne(p, X[n], Y[n]); G.gb2 += g.gb2 / N;
      for (var h = 0; h < H; h++) { G.gW2[h] += g.gW2[h] / N; G.gb1[h] += g.gb1[h] / N; for (var i = 0; i < NV; i++) G.gW1[h][i] += g.gW1[h][i] / N; } }
    return G;
  }
  function avgLoss(p) { var s = 0; for (var n = 0; n < N; n++) s += lossOf(forward(p, X[n]).out, Y[n]); return s / N; }
  function clone(p) { return { W1: p.W1.map(function (r) { return r.slice(); }), b1: p.b1.slice(), W2: p.W2.slice(), b2: p.b2 }; }
  function lerpP(a, b, k) { return { W1: a.W1.map(function (r, h) { return r.map(function (v, i) { return v + (b.W1[h][i] - v) * k; }); }),
    b1: a.b1.map(function (v, h) { return v + (b.b1[h] - v) * k; }), W2: a.W2.map(function (v, h) { return v + (b.W2[h] - v) * k; }), b2: a.b2 + (b.b2 - a.b2) * k }; }
  function snapshot(p) { var outs = X.map(function (x) { return forward(p, x).out; }), loss = 0, right = 0;
    outs.forEach(function (o, i) { loss += lossOf(o, Y[i]); if ((o >= .5 ? 1 : 0) === Y[i]) right++; });
    return { params: clone(p), outs: outs, loss: loss / N, right: right }; }
  /* one epoch: all twenty forward, all twenty backward, one step */
  function trainRun(H, lr, seed, epochs) {
    var p = init(H, seed), hist = [snapshot(p)];
    for (var ep = 1; ep <= epochs; ep++) { var G = gradAvg(p);
      for (var h = 0; h < H; h++) { p.W2[h] -= lr * G.gW2[h]; p.b1[h] -= lr * G.gb1[h]; for (var i = 0; i < NV; i++) p.W1[h][i] -= lr * G.gW1[h][i]; }
      p.b2 -= lr * G.gb2; hist.push(snapshot(p)); }
    return hist;
  }
  function decisive(p, x, y) { var f = forward(p, x), best = 0, bv = -Infinity;
    for (var h = 0; h < p.W1.length; h++) { var c = p.W2[h] * f.a1[h] * (y === 1 ? 1 : -1); if (c > bv) { bv = c; best = h; } } return best; }

  /* ---- state ---------------------------------------------------------------------------------- */
  var st = { step: 0, rev: NG, own: { text: "", x: VOCAB.map(function () { return 0; }), y: 0 }, unit: null, H: 4, lr: .6, seed: 1, ep: 0,
             playing: false, wsel: null, nudge: 0, surf: false };
  var HIST = null, ALLRIGHT = -1, REFEP = 65, stepT0 = 0;
  function retrain() { HIST = trainRun(st.H, st.lr, st.seed, MAXEP);
    ALLRIGHT = -1; for (var e = 0; e <= MAXEP; e++) if (HIST[e].right === N) { ALLRIGHT = e; break; }
    REFEP = ALLRIGHT > 0 ? ALLRIGHT : MAXEP; st.ep = 0; st.unit = null; st.wsel = null; st.nudge = 0; st.playing = false; SURF = null; }
  function P() { return HIST[st.ep].params; }
  function Xc() { return st.rev >= 0 ? X[st.rev] : st.own.x; }
  function Yc() { return st.rev >= 0 ? Y[st.rev] : st.own.y; }
  function revText() { return st.rev >= 0 ? REVIEWS[st.rev][0] : (st.own.text || "(no words)"); }
  function U() { return st.unit != null ? st.unit : decisive(HIST[REFEP].params, Xc(), Yc()); }
  function un(h) { return LETTERS[st.H - 1 - h]; }                  /* unit 0 is drawn lowest, so A is on top */
  function order() { var o = []; for (var h = st.H - 1; h >= 0; h--) o.push(h); return o; }
  function active() { var x = Xc(), o = []; x.forEach(function (c, i) { if (c > 0) o.push(i); }); return o; }
  function nWeights() { return NV * st.H + st.H + st.H + 1; }
  /* one weight, addressed: a line into a hidden unit, a line into the output, or the output's bias */
  function wsel() { return st.wsel || { k: "W2", h: U() === 0 && st.H > 1 ? 1 : 0 }; }
  function wget(p, w) { return w.k === "W1" ? p.W1[w.h][w.i] : w.k === "W2" ? p.W2[w.h] : p.b2; }
  function wset(p, w, v) { if (w.k === "W1") p.W1[w.h][w.i] = v; else if (w.k === "W2") p.W2[w.h] = v; else p.b2 = v; }

      card: function () { var u = U(), f = forward(P(), Xc()), r = Math.max(3, Math.ceil(Math.abs(f.z1[u])));
        return '<span class="k">tanh: from the sum to what unit ' + un(u) + " sends</span>" + plot({ xr: [-r, r], yr: [-1.08, 1.08], f: Math.tanh, hl: [0], aria: "The tanh curve with unit " + un(u) + "'s sum marked",
          yt: [[1, "+1"], [0, "0"], [-1, "−1"]], xt: [[-r, "−" + r], [0, "0"], [r, "+" + r]], xlab: "the sum", pts: [{ x: f.z1[u], y: f.a1[u], cls: f.a1[u] < 0 ? "n" : "", lab: f2(f.z1[u]) + " → " + f2(f.a1[u]), guide: true }] }) + unitRow().replace('class="row"', 'class="row" style="margin:10px 0 0"'); },
      cfg: function () { var u = U(), f = forward(P(), Xc()), ht = {}; ht[u] = ["sends " + f2(f.a1[u]), f.a1[u] < 0 ? "n" : "p"]; return { input: true, reach: 0, reachU: u, focusU: u, elabels: actLabels(u), hidText: ht }; } },

    { ch: 2, title: "The whole hidden layer", cam: function () { return { box: BOX.hid, yaw: -.3, pitch: .13 }; },
      html: function () { return "<p>" + (st.H > 1 ? "The other units do the same, each with its own weights and its own bias. " + cap(nword(st.H)) + " numbers leave the hidden layer." : "With one hidden unit, one number leaves the hidden layer.") + "</p>" +
        "<p>These numbers are the network's own description of the review. From here on they take the place of the word counts: the output unit sees " + (st.H > 1 ? "them" : "this number") + " and nothing else.</p>"; },
      card: function () { var f = forward(P(), Xc());
        return '<table class="t"><tr><th>Unit</th><th>Sum</th><th>Sends</th></tr>' + order().map(function (h) { return '<tr class="pick' + (h === U() ? " on" : "") + '" data-act="unit" data-v="' + h + '"><td>' + un(h) + "</td><td>" + f2(f.z1[h]) + "</td><td>" + sg(f.a1[h]) + "</td></tr>"; }).join("") +
          "</table><small>Click a unit, here or in the drawing, to follow it in the other steps.</small>"; },
      cfg: function () { var f = forward(P(), Xc()), ht = {}; f.a1.forEach(function (a, h) { ht[h] = [s2(a), a < 0 ? "n" : "p"]; }); return { input: true, reach: 1, flow1: true, hidText: ht }; } },

    { ch: 3, title: "The output unit adds up", cam: function () { return { box: BOX.out, yaw: -.24, pitch: .13, pad: [70, 44, 90, 60] }; },
      html: function () { return "<p>The output unit works like a hidden unit. Its inputs are the numbers the hidden layer sends. Each is multiplied by the weight on its line, and the output's bias is added.</p>" +
        "<p>A unit that sends a positive number over a positive weight pushes the sum up. So does a unit that sends a negative number over a negative weight.</p>"; },
      card: function () { var p = P(), f = forward(p, Xc());
        return '<table class="t"><tr><th>Unit</th><th>sends × weight</th><th></th></tr>' + order().map(function (h) { return "<tr><td>" + un(h) + "</td><td>" + sg(f.a1[h]) + " × " + sg(p.W2[h]) + "</td><td>= " + s2(f.a1[h] * p.W2[h]) + "</td></tr>"; }).join("") +
          '<tr class="dim"><td>bias</td><td></td><td>' + s2(p.b2) + '</td></tr><tr class="sum"><td>sum</td><td></td><td><span class="a">' + s2(f.z2) + "</span></td></tr></table>"; },
      cfg: function () { var p = P(), f = forward(p, Xc()), ht = {}; f.a1.forEach(function (a, h) { ht[h] = [s2(a), a < 0 ? "n" : "p"]; });
        return { input: true, reach: 1, outFocus: true, flow2: true, hidText: ht, outText: [["sum " + s2(f.z2), "a"]], elabels: order().map(function (h) { return wl({ k: "W2", h: h }, f2(p.W2[h]), null, .5); }) }; } },

    { ch: 3, title: "From the sum to a probability", cam: function () { return { box: BOX.out, yaw: -.24, pitch: .13, pad: [70, 44, 90, 60] }; },
      html: function () { var f = forward(P(), Xc());
        return "<p>The output unit has its own activation function, the logistic curve. It turns any sum into a number between 0 and 1. The network reports that number as the probability that the review is positive.</p>" +
          "<p>For " + rv() + ": p(positive) = " + sg(f.out - .5, f.out.toFixed(2)) + ". " + verdict(f) + "</p>" +
          "<p>Seen from the hidden layer, the output unit is a logistic regression. Its predictors are the " + nword(st.H) + " number" + (st.H > 1 ? "s" : "") + " the hidden layer sends, where a classifier on word counts has the counts.</p>"; },
      card: function () { var f = forward(P(), Xc()), r = Math.max(4, Math.ceil(Math.abs(f.z2)));
        return '<span class="k">The logistic curve: from the sum to p(positive)</span>' + plot({ xr: [-r, r], yr: [0, 1.04], f: sigmoid, hl: [.5], aria: "The logistic curve with the output unit's sum marked",
          yt: [[1, "1"], [.5, ".5"], [0, "0"]], xt: [[-r, "−" + r], [0, "0"], [r, "+" + r]], xlab: "the sum", pts: [{ x: f.z2, y: f.out, cls: f.out < .5 ? "n" : "", lab: s2(f.z2) + " → " + f.out.toFixed(2), guide: true }] }) +
          "<small>Above 0.5 the network's answer is positive, below 0.5 it is negative.</small>"; },
      cfg: function () { var f = forward(P(), Xc()), ht = {}; f.a1.forEach(function (a, h) { ht[h] = [s2(a), a < 0 ? "n" : "p"]; });
        return { input: true, reach: 2, outFocus: true, hidText: ht, outText: [["p(positive) " + f.out.toFixed(2), f.out < .5 ? "n" : "p"], ["human label: " + (Yc() ? "positive" : "negative"), "v"]] }; } },

    { ch: 4, title: "How wrong is the answer?", cam: camNet,
      html: function () { var f = forward(P(), Xc()), y = Yc(), qy = y ? f.out : 1 - f.out, l = lossOf(f.out, y);
        return "<p>Training needs one number that says how wrong an answer is. That number is the <b>loss</b>. This network uses the cross-entropy: the negative logarithm of the probability that the network gave to the human label.</p>" +
          "<p>The human label for " + rv() + " is " + lab(y) + ". The network gave " + (y ? "positive" : "negative") + " a probability of " + (y ? "" : "1 − " + f.out.toFixed(2) + " = ") + num(qy.toFixed(2)) + ", so the loss is −log(" + qy.toFixed(2) + ") = " + '<span class="m">' + l.toFixed(2) + "</span>.</p>" +
          "<p>The loss is close to 0 when the network is right and sure. It grows quickly when the network is wrong and sure.</p>"; },
      card: function () { var f = forward(P(), Xc()), y = Yc(), qy = y ? f.out : 1 - f.out, l = lossOf(f.out, y), top = Math.max(3, Math.ceil(l));
        return '<span class="k">The loss for one review</span>' + plot({ xr: [0, 1], yr: [0, top], f: function (v) { return -Math.log(Math.max(v, 1e-4)); }, aria: "The loss as a function of the probability given to the human label",
          yt: [[0, "0"], [1, "1"], [top, String(top)]], xt: [[0, "0"], [.5, ".5"], [1, "1"]], xlab: "probability the network gave to the human label", pts: [{ x: qy, y: l, cls: "m", lab: "loss " + l.toFixed(2), guide: true }] }); },
      cfg: function () { var f = forward(P(), Xc()), l = lossOf(f.out, Yc());
        return { input: true, reach: 2, outGlow: mix(COL.acc, COL.neg, clamp01(l / 1.4)), outText: [["p(positive) " + f.out.toFixed(2), f.out < .5 ? "n" : "p"], ["human label: " + (Yc() ? "positive" : "negative"), "v"], ["loss " + l.toFixed(2), "m"]] }; } },

    { ch: 4, title: "The loss over all twenty reviews", cam: camNet,
      html: function () { var hs = HIST[st.ep];
        return "<p>Every review in the training set gets its own loss. Their <b>average</b> says how well the current weights fit the training set as a whole.</p>" +
          "<p>At epoch " + st.ep + " the average loss is " + '<span class="m">' + hs.loss.toFixed(2) + "</span>, and the network is on the right side of 0.5 for " + num(hs.right + " of " + N) + " reviews.</p>" +
          "<p>For this network, learning means changing the " + nWeights() + " numbers so that the average loss gets smaller.</p>"; },
      card: function () { var hs = HIST[st.ep], ls = hs.outs.map(function (o, i) { return lossOf(o, Y[i]); }), top = Math.max(2, Math.ceil(Math.max.apply(null, ls)));
        return '<span class="k">One bar per review</span>' + plot({ h: 170, xr: [0, N], yr: [0, top], yt: [[0, "0"], [top, String(top)]], aria: "The loss of each of the twenty reviews and their average", xlab: "the twenty reviews · click a bar to follow that review",
          extra: function (sx, sy) { var s = ""; ls.forEach(function (l, i) { s += '<rect class="bar' + (i === st.rev ? " me" : "") + '" data-act="rev" data-v="' + i + '" x="' + (sx(i) + 2) + '" y="' + sy(l) + '" width="' + (sx(1) - sx(0) - 4) + '" height="' + Math.max(1, sy(0) - sy(l)) + '" rx="2"><title>' + esc(REVIEWS[i][0]) + " loss " + l.toFixed(2) + "</title></rect>"; });
            return s + '<line class="tan" x1="' + sx(0) + '" y1="' + sy(hs.loss) + '" x2="' + sx(N) + '" y2="' + sy(hs.loss) + '"/><text class="v m" x="' + sx(N) + '" y="' + (sy(hs.loss) - 6) + '" text-anchor="end">average ' + hs.loss.toFixed(2) + "</text>"; } }) +
          (st.rev >= 0 ? "<small>The orange bar is the review you are following.</small>" : "<small>Your own review is not part of the training set, so it has no bar.</small>"); },
      cfg: function () { var f = forward(P(), Xc()); return { input: true, reach: 2, outText: [["average loss " + HIST[st.ep].loss.toFixed(2), "m"]] }; } },

    { ch: 5, title: "Which way should a weight move?", cam: camNet,
      html: function () { var w = wsel();
        return "<p>Take one weight and change it a little, with everything else fixed. If the average loss falls, the change went in the right direction.</p>" +
          "<p>The slider changes the weight on <span class=\"m\">" + wlong(w) + "</span>, drawn in amber. Move it and read the average loss over the twenty reviews.</p>" +
          "<p>How much the loss changes for a small change of the weight is the <b>slope</b> of the loss for this weight. Its sign says which way the weight should move, and its size says how much the weight matters at the moment.</p>"; },
      card: function () { return '<span class="k">Change the weight by <span id="nv">' + s2(st.nudge) + '</span></span><input type="range" id="nudge" min="-2" max="2" step="0.05" value="' + st.nudge + '" aria-label="Change the selected weight">' +
        '<div id="dyn">' + nudgeDyn() + "</div><small>Click another line in the drawing to choose a different weight.</small>"; },
      cfg: function () { var w = wsel(), p = clone(P()), v0 = wget(p, w); wset(p, w, v0 + st.nudge); var f = forward(p, Xc());
        return { input: true, reach: 2, params: p, sel: w, elabels: [{ e: w.k === "b2" ? { k: "W2", h: 0 } : w, s: st.nudge === 0 ? f2(v0) : f2(v0) + " → " + f2(v0 + st.nudge), cls: "m", t: .5 }].filter(function () { return w.k !== "b2"; }),
                 outText: [["p(positive) " + f.out.toFixed(2), f.out < .5 ? "n" : "p"], ["average loss " + avgLoss(p).toFixed(3), "m"]] }; } },

    { ch: 5, title: "Backpropagation starts at the output", cam: camNet,
      html: function () { var g = gradOne(P(), Xc(), Yc()), y = Yc();
        return "<p>Finding every slope by trying would mean running all twenty reviews through the network again for each of the " + nWeights() + " numbers. <b>Backpropagation</b> computes all slopes from one run, by working backwards from the loss. The numbers below are for the review " + rv() + ".</p>" +
          "<p>It starts with the <b>error</b> at the output: p(positive) minus the human label, which is 1 for positive and 0 for negative. Here: " + g.f.out.toFixed(2) + " − " + y + " = " + '<span class="m">' + s2(g.d2) + "</span>.</p>" +
          "<p>For a line into the output, the slope is the error times the number that came over that line. A unit that sent a number far from zero had a large part in the answer, so its weight gets a large slope.</p>"; },
      card: function () { var g = gradOne(P(), Xc(), Yc());
        return '<table class="t"><tr><th>Line</th><th>error × sent</th><th>Slope</th><th>Should go</th></tr>' + order().map(function (h) {
          return "<tr><td>" + un(h) + " → output</td><td>" + s2(g.d2) + " × " + sg(g.f.a1[h]) + '</td><td><span class="m">' + s2(g.gW2[h]) + '</span></td><td class="txt">' + updown(g.gW2[h]) + "</td></tr>"; }).join("") +
          "</table><small>A positive slope means that the loss rises when the weight grows, so the weight should go down. A negative slope means it should go up.</small>"; },
      cfg: function (at) { var g = gradOne(P(), Xc(), Yc());
        return { input: true, reach: 2, grad: { g2: g.gW2, g1: null, ph: reduced ? 1 : Math.min(.44, at / 3) }, outText: [["error " + s2(g.d2), "m"]],
                 elabels: at > 1.1 || reduced ? order().map(function (h) { return { e: { k: "W2", h: h }, s: updown(g.gW2[h]), cls: "m", t: .5 }; }) : [] }; } },

    { ch: 5, title: "… and goes back one layer", cam: camNet,
      html: function () { var act = active(), u = U();
        return "<p>A hidden unit has no human label, so it has no error of its own. It gets a <b>share</b> of the output's error: the error, times the weight on the unit's line to the output, times the slope of the tanh curve where the unit's sum lies. That slope is 1 − sent².</p>" +
          "<p>For a line from a word to a hidden unit, the slope is the unit's share times the word's count. " + (act.length ? "For this review only the lines from " + list(act.map(function (i) { return q(VOCAB[i]); })) + " get a slope, because all other counts are 0." : "All counts are 0 for this review, so none of these lines gets a slope.") + "</p>" +
          "<p>This is the chain rule from calculus, applied layer by layer from the back. Each layer reuses what the layer after it has already worked out.</p>"; },
      card: function () { var p = P(), x = Xc(), g = gradOne(p, x, Yc()), u = U();
        return '<span class="k">Each unit\'s share of the error</span><table class="t"><tr><th>Unit</th><th>error × weight × (1 − sent²)</th><th>Share</th></tr>' + order().map(function (h) {
          return '<tr class="pick' + (h === u ? " on" : "") + '" data-act="unit" data-v="' + h + '"><td>' + un(h) + "</td><td>" + s2(g.d2) + " × " + sg(p.W2[h]) + " × " + (1 - g.f.a1[h] * g.f.a1[h]).toFixed(2) + '</td><td><span class="m">' + s2(g.d1[h]) + "</span></td></tr>"; }).join("") + "</table>" +
          '<span class="k" style="margin-top:12px">The lines into unit ' + un(u) + '</span><table class="t"><tr><th>Line</th><th>share × count</th><th>Slope</th><th>Should go</th></tr>' +
          (active().length ? active().map(function (i) { return "<tr><td>" + VOCAB[i] + " → " + un(u) + "</td><td>" + s2(g.d1[u]) + " × " + x[i] + '</td><td><span class="m">' + s2(g.gW1[u][i]) + '</span></td><td class="txt">' + updown(g.gW1[u][i]) + "</td></tr>"; }).join("") : '<tr class="dim"><td>no word of this review has an input unit</td><td></td><td></td><td></td></tr>') + "</table>"; },
      cfg: function (at) { var g = gradOne(P(), Xc(), Yc()), u = U(), ph = reduced ? 1 : Math.min(1, .44 + at / 3.5), ht = {}; g.d1.forEach(function (d, h) { ht[h] = ["share " + s2(d), "m"]; });
        return { input: true, reach: 2, grad: { g2: g.gW2, g1: g.gW1, ph: ph }, hidText: ht, outText: [["error " + s2(g.d2), "m"]],
                 elabels: ph >= .9 ? active().map(function (i) { return { e: { k: "W1", h: u, i: i }, s: updown(g.gW1[u][i]), cls: "m", t: .62 }; }) : [] }; } },

    { ch: 5, title: "All weights, all reviews", cam: camNet,
      html: function () { return "<p>The same backward run is done for each of the twenty reviews, and the slopes are averaged. The result is one slope for every weight and every bias. Together these " + nWeights() + " slopes are the <b>gradient</b>.</p>" +
        "<p>The amber lines show it. A thicker line has a steeper slope: changing that weight changes the average loss more than changing a thin one.</p>" +
        "<p>One backward run costs about as much as one forward run. That is why networks with billions of weights can be trained at all.</p>"; },
      card: function () { var p = P(), G = gradAvg(p), w = wsel(), pp = clone(p), v0 = wget(p, w), all = [], h, i;
        wset(pp, w, v0 + .001); var up = avgLoss(pp); wset(pp, w, v0 - .001); var dn = avgLoss(pp);
        for (h = 0; h < st.H; h++) { all.push({ k: "W2", h: h }); for (i = 0; i < NV; i++) all.push({ k: "W1", h: h, i: i }); }
        all.sort(function (a, b) { return Math.abs(gget(G, b)) - Math.abs(gget(G, a)); });
        return '<span class="k">A check on ' + wshort(w) + '</span><table class="t"><tr><td>Slope by backpropagation</td><td><span class="m">' + (gget(G, w) < 0 ? "−" : "+") + Math.abs(gget(G, w)).toFixed(4) + "</span></td></tr>" +
          '<tr class="sum"><td>Slope by trying (weight ± 0.001)</td><td>' + ((up - dn) / .002 < 0 ? "−" : "+") + Math.abs((up - dn) / .002).toFixed(4) + "</td></tr></table>" +
          '<span class="k" style="margin-top:12px">The six steepest slopes at epoch ' + st.ep + '</span><table class="t"><tr><th>Line</th><th>Weight</th><th>Slope</th><th>Should go</th></tr>' +
          all.slice(0, 6).map(function (e) { return '<tr class="pick' + (same(e, w) ? " on" : "") + '" data-act="wsel" data-k="' + e.k + '" data-h="' + e.h + '" data-i="' + (e.i == null ? "" : e.i) + '"><td>' + wshort(e) + "</td><td>" + s2(wget(p, e)) + '</td><td><span class="m">' + s3(gget(G, e)) + '</span></td><td class="txt">' + updown(gget(G, e)) + "</td></tr>"; }).join("") +
          "</table><small>Click a row, or a line in the drawing, to run the check on that weight.</small>"; },
      cfg: function (at) { var G = gradAvg(P()); return { input: false, reach: 0, grad: { g2: G.gW2, g1: G.gW1, ph: reduced ? 1 : Math.min(1, at / 2.4) }, sel: st.wsel }; } },

    { ch: 6, title: "The loss as a landscape", view: "surf", cam: camNet,
      html: function () { var S = surface();
        return "<p>Take two weights: " + wlong(S.pr[0]) + " and " + wlong(S.pr[1]) + ". For every pair of values, the twenty reviews give one average loss. Drawn over the two weights, the loss is a surface. It is high where the network fits the reviews badly and low where it fits them well.</p>" +
          "<p>The amber marker is where the network stands at epoch " + st.ep + ": a loss of " + '<span class="m">' + S.here.toFixed(2) + "</span>. The lowest point on this patch has a loss of " + num(S.lo.toFixed(2)) + ".</p>" +
          "<p>The surface is computed for this network, with its other " + (nWeights() - 2) + " numbers held where they are. The network itself never sees it. It knows the loss where it stands, and the slope there.</p>"; },
      card: function () { var S = surface();
        return '<table class="t"><tr><th>Weight</th><th>Now</th><th>Slope</th><th>Lowest at</th></tr>' + S.pr.map(function (w, k) { return "<tr><td>" + wshort(w) + "</td><td>" + s2(k ? S.cb : S.ca) + '</td><td><span class="m">' + s3(S.g[k]) + "</span></td><td>" + s2(S.lowAt[k]) + "</td></tr>"; }).join("") +
          "</table><small>The patch reaches 3 to either side of the two current values. Drag the drawing to look at the surface from another side.</small>"; },
      cfg: function () { return { input: true, reach: 2 }; } },

    { ch: 6, title: "Downhill, one step at a time", view: "surf", cam: camNet,
      html: function () { return "<p>The gradient points in the direction in which the loss rises fastest. <b>Gradient descent</b> takes a step the other way. Every weight changes by its slope times the <b>learning rate</b>, written η.</p>" +
        '<div class="formula">new weight = weight − η × slope</div>' +
        "<p>Then the slope is computed again at the new place, and the next step follows. Near the bottom of a valley the surface is flatter, so the steps get shorter while η stays the same.</p>" +
        "<p>In this step only the two weights of the landscape move, " + WALK + " times, with the learning rate η = " + st.lr + " that is set for training.</p>"; },
      card: function () { var S = surface(), p1 = S.path[1], pe = S.path[WALK];
        return '<span class="k">The first step</span><table class="t"><tr><th>Weight</th><th>Now</th><th>− η × slope</th><th>New</th></tr>' + S.pr.map(function (w, k) { var v = k ? S.cb : S.ca;
          return "<tr><td>" + wshort(w) + "</td><td>" + s2(v) + "</td><td>− " + st.lr + ' × <span class="m">' + s3(S.g[k]) + "</span></td><td>" + s2(p1[k]) + "</td></tr>"; }).join("") +
          '<tr class="sum"><td>Average loss</td><td>' + f3(S.here) + "</td><td></td><td>" + (isFinite(p1[2]) ? f3(p1[2]) : "–") + "</td></tr></table>" +
          '<div class="res">After ' + WALK + " steps the loss is <b>" + (isFinite(pe[2]) ? f3(pe[2]) : "not a number") + "</b>" + (inPatch(S, pe) ? "" : ", and the walk has left the patch that is drawn") + ". The lowest loss on the patch is " + f3(S.lo) + ".</div>" + replayBtn(); },
      cfg: function () { return { input: true, reach: 2, walk: "one", arrows: false }; }, pre: true },

    { ch: 6, title: "The learning rate", view: "surf", cam: camNet,
      html: function () { return "<p>Three walks start from the same place and differ only in the learning rate.</p>" +
        "<p>With a small η every step is safe and the walk is slow. With a large η a step can carry across the valley and land higher on the other side, so the walk swings from side to side or leaves the valley altogether.</p>" +
        "<p>Nobody knows the right learning rate in advance. It is tried out, like the other settings of a model.</p>" +
        "<p>The picture also hides something. Training moves all " + nWeights() + " numbers at once, and that landscape has " + nWeights() + " axes and cannot be drawn. Each time the other weights move, this patch changes its shape as well.</p>"; },
      card: function () { var S = surface();
        return '<table class="t"><tr><th>Learning rate</th><th>Start</th><th>10 steps</th><th>' + WALK + " steps</th></tr>" + S.races.map(function (r) { function show(pt) { return !isFinite(pt[2]) ? "–" : f3(pt[2]) + (inPatch(S, pt) ? "" : "*"); }
          return '<tr><td><i class="sw" style="background:' + rgba(r.col, 1) + '"></i>η = ' + r.eta + "</td><td>" + f3(S.here) + "</td><td>" + show(r.path[10]) + "</td><td>" + show(r.path[WALK]) + "</td></tr>"; }).join("") +
          "</table><small>The table gives the average loss. A star marks a walk that has left the patch that is drawn. The lowest loss on the patch is " + f3(S.lo) + ".</small>" + replayBtn(); },
      cfg: function () { return { input: true, reach: 2, walk: "race" }; } },

    { ch: 7, title: "One step for all weights", cam: camNet,
      html: function () { var e0 = Math.min(st.ep, MAXEP - 1), a = HIST[e0], b = HIST[e0 + 1], x = Xc();
        return "<p>Training takes the same kind of step with all " + nWeights() + " numbers at once. Each moves against its own slope, by η = " + st.lr + " times that slope.</p>" +
